id: N03c-neon-branch-runner
title: Give CI an ephemeral Neon branch that can never descend from production data and can never outlive its run
goal_refs: [G10]
decisions: [D20, D25, D25a, D38, D39]
depends_on: [N03a-github-actions-base, N02b-migration-ci-check]
phase: A1
estimate_hours: 8
estimate_if_split: { N03c: 6, N03c2-synthetic-ci-seed: 2 }

# The ONLY context the Builder loads. Never the repo.
context_query: >
  codegraph explore "drizzle.config.js migrationUrl DATABASE_URL_UNPOOLED lib/db/index.js
  connectionString scripts/seed.mjs scripts/verify/fixtures/synthetic-identifiers.json
  lib/db/schema.js exams userKv"

# ─────────────────────────────────────────────────────────────────────────────
rationale: >
  WHAT IS TRUE TODAY, checked on origin/main @3b3a5f5.

  There is no `.github/` directory in this repository at all — not a workflow, not an
  action. Nothing has ever run on a PR. So "CI has no database" understates it: CI has
  nothing, and N03a is only now creating the shell this node fills.

  The repo is PUBLIC. `gh repo view MarceloDe/wrvu --json visibility` returns
  `{"visibility":"PUBLIC","isPrivate":false}`. Every byte a workflow prints is
  world-readable, forever, to anyone — no login, no rate limit worth the name. That single
  fact converts a routine CI-database task into a PHI-disclosure surface, and it is why
  this node is written the way it is.

  The one recorded attempt at a safe throwaway database was abandoned, and the reason is
  recorded in DECISIONS.md ("Vercel will not export integration secrets, at any CLI
  version", 2026-08-18): Preview shares the PRODUCTION `DATABASE_URL`, and `vercel env
  pull` writes the literal string `[SENSITIVE]` in its place on CLI 54.14.2 and 59.1.4
  alike. There is therefore no local restore path, the planned Neon disconnect/reconnect
  was correctly NOT performed, and that correction states outright that "D20's real Neon
  branch per verification run is currently unimplementable." This node is the answer to
  that sentence. It is implementable in CI, where a branch is cheap, disposable, and
  created through the Neon API rather than pulled out of Vercel.

  THE DOMINANT HAZARD IS PARENTAGE, NOT COST. `neon-almond-leaf`'s `main` branch holds
  real user rows. A Neon branch is copy-on-write from its parent: create from `main` and
  you have a live, writable, fully-populated copy of production behind a workflow whose
  logs are public — and the run goes GREEN, because everything works. Nothing in a passing
  CI run distinguishes "branched from an empty template" from "branched from production".
  D25a forbids the second outright. Every contract below exists to make it impossible
  rather than merely discouraged, and the guard is tested by a run that must REFUSE.

  THE SECOND HAZARD IS SURVIVAL. Neon bills per branch and per compute-hour, and a
  cancelled workflow, a runner crash, or a `create` that fails after the API call
  succeeded all leave a branch behind. A leaked branch of a synthetic template is a bill;
  a leaked branch of production is a breach. `if: always()` teardown covers cancellation
  but not a dead runner, so a scheduled reaper is a required second layer, not polish.

  THE THIRD HAZARD IS FORKS, AND IT IS THE ONE THAT LOOKS LIKE SAFETY. On a public repo,
  `pull_request` runs from forks get no repository secrets. Guard the DB jobs on
  `head.repo.full_name == github.repository` and they SKIP — and GitHub renders a skipped
  required job as a grey check that satisfies branch protection. The same thing happens
  when `NEON_API_KEY` is simply absent, which is the state this node ships in. Without a
  companion check that fails on an unexplained skip, this node's most likely real-world
  failure is that it appears to work while verifying nothing — precisely the vacuous pass
  INV-CHECKS-ACTUALLY-RUN was written for.

  FOUR CONCRETE FILE FACTS THE BUILDER MUST HONOUR.
  (1) `drizzle.config.js:8-12` resolves its connection from
  `DATABASE_URL_UNPOOLED || POSTGRES_URL_NON_POOLING || DATABASE_URL || POSTGRES_URL`, and
  `:21-26` warns that "session-level DDL may fail through pgBouncer" on the pooled
  fallback. Exporting only a pooled URL therefore yields a migrations job that warns and
  then fails intermittently on exactly the DDL migrations are made of. The action must
  export BOTH strings.
  (2) `lib/db/index.js:9-14` WARNS on a missing connection string and continues. A DB job
  that loses its env does not crash at import; it fails later, elsewhere, ambiguously —
  or passes, if nothing queries. The job must assert its env before it does anything.
  (3) `package.json` `db:seed` is `node --env-file=.env.local scripts/seed.mjs`, hardwired
  to a file that cannot exist on a runner, and `scripts/seed.mjs:11-15` exits 1 telling
  the operator to run `vercel env pull .env.local` — the command DECISIONS.md just
  established returns `[SENSITIVE]`. The documented seeding path is dead in CI and must
  not be invoked there.
  (4) `lib/db/schema.js:54-76` shows `exams` has no name and no MRN column. That is worth
  stating because it is the property the synthetic seed must not quietly repair.

  WHY NOT A POSTGRES SERVICE CONTAINER. N02b substituted `postgres:17` to get moving. It
  is a different database: no Neon pooler, no `DATABASE_URL_UNPOOLED` distinction, no
  branch semantics, none of the `@neondatabase/serverless` HTTP driver path that
  `lib/db/index.js:17` actually uses in production. A migration that passes there and
  fails on Neon is the exact class of bug D20 exists to catch. Re-pointing that job is
  part of THIS node's contract so the substitution cannot become permanent by neglect.

# ─────────────────────────────────────────────────────────────────────────────
contracts:

  # -- lifecycle: create ------------------------------------------------------
  - "`.github/actions/neon-branch/action.yml` is a composite action with inputs
     `project-id` (required), `parent` (required), `api-key` (required),
     `branch-name` (default `ci-${{ github.run_id }}-${{ github.run_attempt }}`),
     `role` (default `neondb_owner`), `database` (default `neondb`);
     and outputs `branch-id`, `branch-name`, `database-url`, `database-url-unpooled`"
  - "The action's only logic lives in `scripts/neon/branch.mjs` and `scripts/neon/guard.mjs`;
     action.yml contains no branching shell beyond invoking them, so the behaviour is unit
     testable off a runner"
  - "`scripts/neon/branch.mjs` exports
     `createEphemeralBranch({ projectId, parent, name, apiKey }): Promise<{ branchId, name,
     pooled, unpooled, host }>` — it calls `assertParentIsSynthetic` and
     `assertParentIsEmpty` BEFORE the POST that creates anything, and it propagates their
     errors unchanged"
  - "`createEphemeralBranch` throws `BranchQuotaError` when Neon rejects the create for
     plan/branch limits. It never falls back to an existing branch, never reuses `dev`,
     and never returns a connection string it did not just create (INV-NO-SWALLOW)"

  # -- the parent guard, which is the point of the node -----------------------
  - "`scripts/neon/guard.mjs` exports `assertParentIsSynthetic(parent, project): void`,
     throwing `ParentNotSyntheticError` (`.code === 'PARENT_NOT_SYNTHETIC'`) when ANY of:
     `parent.default === true`; `parent.protected === true`;
     `parent.id === project.default_branch_id`;
     `parent.name` case-insensitively matches `main|master|prod|production|default`"
  - "`scripts/neon/guard.mjs` exports
     `assertParentIsEmpty(connectionString): Promise<{ tables: string[], rows: number }>`,
     throwing `ParentHasRowsError` (`.code === 'PARENT_HAS_ROWS'`, `.detail` naming the
     offending tables and counts) when any BASE TABLE in schema `public` has `count(*) > 0`.
     It throws, not returns false, and it counts exactly — never `reltuples`"
  - "Both guards run pre-create. On refusal the process exits 1 having issued zero
     mutating Neon API calls, and prints `NEON_GUARD_REFUSED: <code>` on stdout"

  # -- lifecycle: teardown ----------------------------------------------------
  - "`.github/actions/neon-branch-teardown/action.yml` is a SEPARATE composite action.
     Composite actions do not support `post:` steps — only JavaScript actions do — so the
     teardown is a distinct step the caller runs with `if: always()`. An `if: always()`
     step inside the create action's own `runs.steps` would run in the create action's
     lifetime, not the job's, and would not fire on a mid-job failure"
  - "`scripts/neon/branch.mjs` exports
     `deleteBranch({ projectId, branchId, branchName, apiKey }): Promise<{ deleted: boolean,
     branchId: string|null }>` — idempotent: it resolves `branchName` to an id when
     `branchId` is empty (the create-failed case), exits 0 on a 404, and prints
     `NEON_TEARDOWN: nothing-to-delete` when neither resolves"
  - "`scripts/verify/ci-branch-cleanup.mjs` parses every file in `.github/workflows/` and
     exits 1 when any job that uses `./.github/actions/neon-branch` lacks a
     `./.github/actions/neon-branch-teardown` step carrying `if: always()`. It also exits 1
     when it finds zero workflows using the action, so it cannot pass vacuously"

  # -- secret hygiene ---------------------------------------------------------
  - "`scripts/neon/branch.mjs` writes `::add-mask::<value>` to stdout for the pooled URI,
     the unpooled URI, the endpoint host, and the role password — each on its own line and
     ALL of them before the first `$GITHUB_OUTPUT` write. No connection string is ever
     printed outside an `::add-mask::` directive"
  - "The Neon API key is passed to `scripts/neon/*` by environment variable only. It never
     appears in an `args:`, a `run:` interpolation, or a URL query string"

  # -- fork and absent-secret handling ----------------------------------------
  - "Every DB-touching job in `.github/workflows/ci.yml` carries the guard expression, byte
     for byte:
     `if: github.event.pull_request.head.repo.full_name == github.repository`"
  - "`.github/workflows/ci.yml` defines a job `db-jobs-attested` that runs `if: always()`,
     is listed in branch protection as required, and calls
     `node scripts/verify/db-jobs-attested.mjs --migrations-result <result> --is-fork <bool>`.
     That script exits 1 — RED, not skipped — when `migrations` did not run
     (`skipped|cancelled`) on a non-fork PR, whatever the cause, absent `NEON_API_KEY`
     included. It exits 0 only when `migrations` succeeded, or when the PR genuinely came
     from a fork, and in the fork case it prints the stated reason"

  # -- the reaper -------------------------------------------------------------
  - "`.github/workflows/neon-reaper.yml` runs on `schedule` (hourly) and
     `workflow_dispatch`, deletes every branch whose name starts with `ci-` and whose
     `created_at` is older than 24h, writes the deleted ids to
     `$GITHUB_STEP_SUMMARY`, and FAILS the run when a deletion errors"

  # -- re-pointing N02b -------------------------------------------------------
  - "The `migrations` job in `.github/workflows/ci.yml` no longer declares a
     `services: postgres:17` container. It calls `./.github/actions/neon-branch`, exports
     both `DATABASE_URL` (pooled) and `DATABASE_URL_UNPOOLED` (direct) into the job env,
     asserts both are non-empty before its first command, then runs `npm run db:migrate`
     followed by N02b's DB-touching tests, then tears down with `if: always()`"

  # -- self-test surface, so verification is reproducible ---------------------
  - "`.github/workflows/neon-selftest.yml` exposes `workflow_dispatch` with input
     `mode: success | fail-midjob | bad-parent | fork-sim`, each mode exercising exactly
     one path: normal run; a step that `exit 1`s between create and teardown; `parent: main`
     to trip the guard; and a run with the fork guard forced true. A static assertion in
     `scripts/verify/ci-branch-cleanup.mjs` requires the fork guard expression in
     `neon-selftest.yml` to be byte-identical to the one in `ci.yml`, so the simulation
     cannot drift from the real condition it stands in for"

invariants:
  - INV-NO-PHI-IN-CLOUD      # the whole parent guard
  - INV-CHECKS-ACTUALLY-RUN  # skipped DB jobs must never read as green
  - INV-PROD-AUDITED         # the API key acts against the production Neon project
  - INV-NO-SWALLOW           # no silent fallback to a shared branch on quota/auth failure
  - INV-ALWAYS-SHIPPABLE     # CI-only; the three deployables are untouched

# ─────────────────────────────────────────────────────────────────────────────
verify:
  runtime:

    # Guard logic as a pure unit, off the runner. Mocks permitted here ONLY (D20):
    # these are pure predicates over Neon API JSON, and no done_when rests on them alone.
    - "node --test scripts/test/neon-guard.test.mjs
       # >=8 cases; the file asserts its own executed-case count and exits 1 on a mismatch,
       # so a deleted test is a failure rather than a quieter pass (INV-CHECKS-ACTUALLY-RUN)"

    # Real Neon API, real GitHub Actions. Capture the branch list FIRST — this is the
    # baseline every later comparison is made against.
    - "npx neonctl branches list --project-id \"$NEON_PROJECT_ID\" --output json
       > goals/evidence/N03c-neon-branch-runner/branch-list-before.json"

    - "gh workflow run neon-selftest.yml --repo MarceloDe/wrvu -f mode=success"
    - "gh workflow run neon-selftest.yml --repo MarceloDe/wrvu -f mode=fail-midjob"
    - "gh workflow run neon-selftest.yml --repo MarceloDe/wrvu -f mode=bad-parent"
    - "gh workflow run neon-selftest.yml --repo MarceloDe/wrvu -f mode=fork-sim"

    - "gh run view <success-run-id>     --repo MarceloDe/wrvu --json conclusion,jobs
       > goals/evidence/N03c-neon-branch-runner/success-run.json          # conclusion: success"
    - "gh run view <fail-midjob-run-id> --repo MarceloDe/wrvu --json conclusion,jobs
       > goals/evidence/N03c-neon-branch-runner/failed-run-cleanup.json   # conclusion: failure,
       # AND the teardown step's conclusion is 'success' inside a failed job"
    - "gh run view <bad-parent-run-id>  --repo MarceloDe/wrvu --json conclusion,jobs
       > goals/evidence/N03c-neon-branch-runner/parent-guard-refusal.json # conclusion: failure"
    - "gh run view <fork-sim-run-id>    --repo MarceloDe/wrvu --json conclusion,jobs
       > goals/evidence/N03c-neon-branch-runner/fork-skip-run.json
       # migrations: skipped, db-jobs-attested: failure"

    - "gh run view <bad-parent-run-id> --repo MarceloDe/wrvu --log
       | grep -q 'NEON_GUARD_REFUSED: PARENT_NOT_SYNTHETIC'"
    - "gh run view <bad-parent-run-id> --repo MarceloDe/wrvu --log
       | grep -q 'NEON_TEARDOWN: nothing-to-delete'
       # positive evidence that the refusal created nothing, not merely that it stopped"

    # The Validator runs this itself, minutes after the four runs, from its own shell.
    - "npx neonctl branches list --project-id \"$NEON_PROJECT_ID\" --output json
       | tee goals/evidence/N03c-neon-branch-runner/branch-list-after.json
       | jq '[.[] | select(.name | startswith(\"ci-\"))] | length'    # -> 0"

    - "diff <(jq -S '[.[]|{id,name,parent_id,created_at,default}]'
                goals/evidence/N03c-neon-branch-runner/branch-list-before.json)
            <(jq -S '[.[]|{id,name,parent_id,created_at,default}]'
                goals/evidence/N03c-neon-branch-runner/branch-list-after.json)
       # -> empty. Projected to identity fields: `updated_at` and `current_state` drift on
       # their own and a raw diff would be noise, not signal."

    # Secret scan by SHAPE, not by value, so a Validator holding no credentials can run it.
    - "node scripts/verify/ci-log-secret-scan.mjs
         --repo MarceloDe/wrvu --run <success-run-id> --run <fail-midjob-run-id>
         --run <bad-parent-run-id> --run <fork-sim-run-id>
       | tee goals/evidence/N03c-neon-branch-runner/log-secret-scan.txt
       # fetches each log via `gh run view --log` and exits 1 on any match of:
       #   postgres(ql)?://            any connection URI
       #   ep-[a-z0-9-]+\\.[a-z0-9-]+\\.aws\\.neon\\.tech   a Neon endpoint host
       #   napi_[A-Za-z0-9]{20,}       a Neon API key
       #   AKIA|-----BEGIN             generic credential shapes
       # It exits 1 when a named run yields zero log bytes, so an unreachable log is a
       # failure rather than a clean scan."

    # Full replay against the ephemeral branch — the thing N02b could not do on Neon.
    - "gh run view <success-run-id> --repo MarceloDe/wrvu --json jobs
       | jq -e '.jobs[] | select(.name==\"migrations\")
                | .steps[] | select(.name|test(\"db:migrate|test:db\")) | .conclusion==\"success\"'"

  static:
    - "! grep -n 'postgres:17' .github/workflows/ci.yml"
    - "grep -q 'add-mask' scripts/neon/branch.mjs"
    - "grep -q \"github.event.pull_request.head.repo.full_name == github.repository\"
       .github/workflows/ci.yml"
    - "node scripts/verify/ci-branch-cleanup.mjs
       # every neon-branch job has an always() teardown; >=1 workflow uses the action;
       # the fork-guard expressions in ci.yml and neon-selftest.yml are byte-identical"
    - "! grep -rn 'neonctl\\|neon.tech' .github/workflows/ci.yml
       # connection handling belongs in the action, not inlined into job shell"

  manual:
    - "Operator confirms in the Neon console that `ci-template` reports 0 rows across all
       tables before it is first used as a parent. The automated `assertParentIsEmpty`
       probe re-checks this on every run; the manual confirmation is the bootstrap, since
       the first run is the one with nothing yet watching it."

  evidence:
    - branch-list-before.json
    - branch-list-after.json
    - success-run.json
    - failed-run-cleanup.json
    - parent-guard-refusal.json
    - fork-skip-run.json
    - log-secret-scan.txt
    - guard-unit-tests.txt
    - cleanup-lint.txt

# ─────────────────────────────────────────────────────────────────────────────
done_when:

  - "Four run ids are named, one per mode, and `gh run view <id> --json conclusion` returns:
     success -> `success`; fail-midjob -> `failure`; bad-parent -> `failure`;
     fork-sim -> `failure`. The Validator fetches each conclusion itself; a Builder-supplied
     transcript is not accepted."

  - "In the success run and the fail-midjob run, the job log contains a created branch id
     matching `br-[a-z0-9-]+` and, later in the SAME job, a teardown line naming that same
     id. The two ids are compared as strings, not eyeballed."

  - "The teardown step's conclusion is `success` inside the fail-midjob run's FAILED job —
     read from `failed-run-cleanup.json`'s `.jobs[].steps[]`. A failed job that skipped its
     teardown would leave a branch, so the job conclusion alone is not sufficient evidence."

  - "`npx neonctl branches list --project-id \"$NEON_PROJECT_ID\" --output json
     | jq '[.[]|select(.name|startswith(\"ci-\"))]|length'` returns 0, run by the Validator
     from its own shell after all four runs have completed. The Builder's
     `branch-list-after.json` is corroboration, not proof."

  - "The parent-guard refusal created nothing: the identity projection
     `[{id,name,parent_id,created_at,default}]` of branch-list-before.json and
     branch-list-after.json is byte-identical under `jq -S`, AND the bad-parent log contains
     both `NEON_GUARD_REFUSED: PARENT_NOT_SYNTHETIC` and `NEON_TEARDOWN: nothing-to-delete`."

  - "`node scripts/verify/ci-log-secret-scan.mjs` over all four run ids exits 0 with a
     non-zero byte count reported per run. Zero matches for connection URIs, Neon endpoint
     hosts, and `napi_` keys across every log line of every run."

  - "`grep -n 'postgres:17' .github/workflows/ci.yml` returns nothing and exits 1, and the
     `migrations` job's step list in `success-run.json` names
     `./.github/actions/neon-branch`."

  - "In the fork-sim run, `.jobs[]` shows `migrations` with conclusion `skipped` and
     `db-jobs-attested` with conclusion `failure`. A skip therefore cannot masquerade as a
     pass, and the same mechanism keeps the PR red while `NEON_API_KEY` is absent."

  - "`node scripts/verify/ci-branch-cleanup.mjs` exits 0 on the delivered tree, and exits 1
     when the Validator deletes the teardown step from a scratch copy of `ci.yml` — proving
     the linter fails when the thing it checks is missing (INV-CHECKS-ACTUALLY-RUN)."

  - "`node --test scripts/test/neon-guard.test.mjs` passes, and exits 1 when the Validator
     mutates `assertParentIsSynthetic` on a scratch copy to accept `{default: true}` —
     proving the guard's tests bind the guard's behaviour."

# ─────────────────────────────────────────────────────────────────────────────
blocked_external:
  summary: >
    The node's code, unit tests, static checks and linter are fully buildable and verifiable
    today. The four runtime runs need a Neon API key and a named synthetic parent. Until
    both land, every DB-touching job stays skipped-with-reason and `db-jobs-attested` keeps
    the PR RED. It must never go green on an absent database — that behaviour is itself a
    contract of this node, not a degradation of it.
  items:

    - id: NEON_API_KEY
      why: branch create/delete against the Neon project
      command: |
        # create the key in the Neon console (Account settings -> API keys), then:
        gh secret set NEON_API_KEY --repo MarceloDe/wrvu
      note: >
        Scope it to the single project. DECISIONS.md records that the Neon account attached
        to this Vercel installation was never email-verified, which blocked minting a key.
        That record may now be STALE: goals/state.json `dev_database` documents branch
        `dev` (`br-late-paper-at5h75si`), schema-only from `main`, 15 tables, zero rows,
        created 2026-08-18 and verified writable on Postgres 17.10 — which cannot have
        happened without console or API access. The discriminating command, which the
        operator runs before assuming this is blocked:
            npx neonctl projects list --output json

    - id: NEON_PROJECT_ID
      why: the action takes the project as an input and hardcodes nothing
      command: |
        gh variable set NEON_PROJECT_ID --repo MarceloDe/wrvu --body '<project-id>'
      note: >
        PREFER A SEPARATE NEON PROJECT. The 2026-08-18 correction in DECISIONS.md
        recommends "a separate Neon project, not the Vercel-managed one" — a free project
        in a personal account, holding only synthetic data, never wired to production. That
        removes this node's dominant hazard by construction instead of policing it. If the
        operator instead points `NEON_PROJECT_ID` at `neon-almond-leaf`, the parent guard is
        the only thing standing between a CI run and real user rows, and that is exactly
        the configuration the bad-parent verification run exercises.

    - id: ci-template
      why: a NAMED synthetic parent, so `parent:` is never a production branch
      command: |
        npx neonctl branches create --project-id <project-id> \
          --name ci-template --parent main --schema-only
        # then confirm zero rows before first use:
        npx neonctl connection-string ci-template --project-id <project-id> \
          | xargs -I{} psql {} -Atc \
            "select coalesce(sum(n),0) from (select (xpath('/row/c/text()', \
             query_to_xml(format('select count(*) as c from %I.%I', table_schema, table_name), \
             false, true, '')))[1]::text::bigint as n \
             from information_schema.tables \
             where table_schema='public' and table_type='BASE TABLE') t"   # -> 0
      note: >
        Schema-only parentage from `main` is the ONLY acceptable creation path, and it is a
        production action: append it to goals/evidence/prod-audit-log.jsonl per
        INV-PROD-AUDITED. The existing `dev` branch is NOT an acceptable substitute — it is
        agent-writable and its emptiness is not a maintained property.

    - id: required-check
      why: a red companion check only protects the branch if it is required
      command: |
        gh api -X PATCH repos/MarceloDe/wrvu/branches/main/protection/required_status_checks \
          -f 'checks[][context]=db-jobs-attested'

    - id: real-fork-pr
      why: fork-sim stands in for a real fork and the substitution must eventually be paid
      command: |
        # from a SECOND GitHub account (a repo cannot be forked to its own owner):
        gh repo fork MarceloDe/wrvu --clone --remote
        gh pr create --repo MarceloDe/wrvu --title 'fork probe: db jobs must skip red'
      note: >
        Lower priority than the rest. `fork-sim` plus the byte-identical-expression static
        check makes the real fork PR a confirmation, not the primary evidence. Record it as
        an operator_must_close item rather than holding the node.

# ─────────────────────────────────────────────────────────────────────────────
split_recommended:
  recommended: true
  reason: >
    The backlog entry bundles TWO contracts. The first is branch LIFECYCLE — create,
    guard, mask, tear down, reap, re-point N02b. The second is branch CONTENT — seeding
    `ci-template` from `scripts/verify/fixtures/synthetic-identifiers.json`. They are
    separable because a schema-only branch with zero rows is a complete, useful and
    strictly safer CI database: N02b's migration checks need a schema, not rows. The tell
    is in the backlog entry itself — the seeding contract has no corresponding done_when,
    which makes it an unverified contract, and an unverified contract is either given
    teeth or moved.
  seam: >
    N03c (this file, 6h) ends at "the branch exists, is provably not descended from
    production, and is provably gone". N03c2-synthetic-ci-seed (2h) begins at "the branch
    is populated".
  n03c2_contract: >
    `scripts/seed-synthetic.mjs` reads `scripts/verify/fixtures/synthetic-identifiers.json`
    — the SAME file N00f created, reusing its 12 invented rows rather than inventing a
    second fixture vocabulary (D38) — and inserts into `exams(user_id, batch_id, exam_date,
    site, procedure, wrvu, source)` only. It must NOT persist the fixture's `name` or `mrn`
    values anywhere, and `lib/db/schema.js:54-76` gives it nowhere to put them.
    Its verification is the sharp part and belongs with it: after seeding, a scan of every
    text and jsonb column on the ephemeral branch for any of the 12 fixture surnames or the
    12 `MRN \\d{8}` strings must return zero rows. That scan is a live
    INV-NO-PHI-IN-CLOUD probe against a real database, and it fails loudly the day someone
    adds a `patient_name` column. It also must NOT be `npm run db:seed`, which is
    `node --env-file=.env.local scripts/seed.mjs` and cannot run on a runner.

# ─────────────────────────────────────────────────────────────────────────────
rollback: >
  Delete `.github/actions/neon-branch*`, `.github/workflows/neon-reaper.yml` and
  `.github/workflows/neon-selftest.yml`, and revert the `migrations` job to N02b's
  `postgres:17` service container by cherry-picking its original job definition out of git
  history — keep that definition in history for exactly this reason, so the revert is a
  cherry-pick rather than a rewrite. Then reap strays:
      npx neonctl branches list --project-id "$NEON_PROJECT_ID" --output json \
        | jq -r '.[]|select(.name|startswith("ci-"))|.id' \
        | xargs -r -n1 npx neonctl branches delete --project-id "$NEON_PROJECT_ID"
  Revoke `NEON_API_KEY` in the Neon console and `gh secret delete NEON_API_KEY --repo
  MarceloDe/wrvu`. Leave `db-jobs-attested` in place while any DB job remains, and remove
  it from required checks only in the same commit that removes the last DB job — otherwise
  the revert reopens the silent-skip hole this node closed.
  NO PRODUCTION IMPACT BY CONSTRUCTION: the action never writes to `main` and never creates
  from it; the parent guard is what enforces that, and the bad-parent run is the evidence
  the enforcement is real. The only production-adjacent artifacts are the API key and the
  one-off `ci-template` create, both logged per INV-PROD-AUDITED and both reversed above.

# ─────────────────────────────────────────────────────────────────────────────
notes: >
  ORDER OF OPERATIONS FOR THE BUILDER. Write `scripts/neon/guard.mjs` and its unit tests
  FIRST and get them green off a runner. The guard is the node; the YAML is packaging. Do
  not debug a predicate through the GitHub Actions log — it is slow, and every iteration
  is public.

  CONCURRENCY. Add `concurrency: { group: ci-db-${{ github.ref }}, cancel-in-progress: true }`
  to the DB job so pushes do not stack branches. Cancellation is precisely the case
  `if: always()` covers and a dead runner does not, which is the reaper's whole job.

  BRANCH NAME COLLISIONS. `ci-<run_id>-<attempt>` is unique per attempt; a re-run gets a
  new attempt number and therefore a new branch. Do not key on `run_id` alone — a re-run
  would collide with a branch the first attempt may still be tearing down.

  ROW PROBE COST. `assertParentIsEmpty` runs an exact `count(*)` per public table on every
  CI run. Against a schema-only template that is ~15 empty scans and costs nothing. Do NOT
  optimise it into `reltuples` — the estimate is 0 or -1 on a freshly branched table
  regardless of contents, which would make the guard pass on a full copy of production.
  That optimisation is the single most likely way to silently disarm this node.

  WHAT THIS NODE DOES NOT DO. It does not give the PWA Preview deployments a database, and
  it does not touch Vercel. Preview still shares the production `DATABASE_URL`; that is a
  separate, still-open problem recorded in DECISIONS.md and it is not closed by anything
  here. Do not let a green CI run be read as evidence that Preview is safe.

id: N00b-rotate-credentials
title: Rotate CLERK_SECRET_KEY and retire SETUP_TOKEN
goal_refs: [G10]
decisions: [D18]
depends_on: [N00a-remove-token-gated-routes]
phase: A0
estimate_hours: 1
priority: 2
severity: live-exposure

rationale: >
  N00a removes the doors. This node changes the locks. Because no audit log ever existed
  on the token-gated routes, it is not possible to establish that SETUP_TOKEN was never
  used — and SETUP_TOKEN was sufficient to read CLERK_SECRET_KEY's full authority. Both
  must be treated as potentially compromised. Rotation is not optional cleanup; it is the
  half of the fix that addresses what may already have happened.

context_query: >
  codegraph explore "CLERK_SECRET_KEY environment variable clerk backend api auth"

contracts:
  - A new Clerk secret key is issued and set in Vercel for production, preview and development
  - The previous Clerk secret key is revoked in the Clerk dashboard
  - SETUP_TOKEN is deleted from every Vercel environment and from .env.example
  - .env.example documents every environment variable the app actually reads, with no
    undocumented secrets remaining
  - "A Clerk user-session audit is performed: every active session is revoked, forcing
     re-authentication, and the user list is reviewed against the expected roster"

invariants: [INV-PROD-AUDITED]

verify:
  runtime:
    - "vercel env ls | grep -c SETUP_TOKEN            # expect 0"
    - "node scripts/ops/clerk-admin.mjs --verify-key  # succeeds with the new key"
    - "node scripts/ops/clerk-admin.mjs --verify-key --key <old-clerk-secret-key>   # expect 401"
    - "node scripts/ops/clerk-admin.mjs --list-users > goals/evidence/N00b-rotate-credentials/user-roster.json"
    - "curl -sS https://fella.cc/api/health   # app still healthy after rotation"
  static:
    - "! grep -rn 'SETUP_TOKEN' ."
  manual:
    - "Review user-roster.json against the expected list of colleagues. Any unrecognised account is an incident, not a surprise."
  evidence: [user-roster.json, key-rotation-log.txt, old-key-401.txt]

done_when:
  - The old Clerk secret key returns 401 against the Clerk Backend API
  - The new key is active in all three Vercel environments and the app is healthy
  - SETUP_TOKEN exists nowhere — not in Vercel, not in .env.example, not in the repo
  - The user roster has been reviewed and every account is accounted for
  - All pre-rotation sessions are revoked

rollback: >
  None. Rotation is forward-only by design — restoring a revoked key would restore the
  exposure. If the new key is misconfigured, issue another new key; never reinstate the old.

notes: >
  Order matters. N00a must ship first so the new key is never readable through a
  deployed token-gated route. Rotating before deletion would leak the new key through the
  same hole.
  Reviewing the roster is the one genuinely manual step in A0 and it is the step most
  likely to be skipped. It is also the only way an existing compromise would be noticed.

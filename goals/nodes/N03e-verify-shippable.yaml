# ─────────────────────────────────────────────────────────────────────────────
rollback: >
  Tooling only. No deploy, no schema, no migration, no data. `git revert` the PR in
  MarceloDe/wrvu and the companion commit in MarceloDe/neurorvu-ios (api/package.json +
  api/tests/).

  TWO THINGS THE REVERT DOES NOT UNDO, and both must be done by hand:

  (1) ORDERING HAZARD — every A1-through-F node's done_when is gated on this command.
  Reverting it silently disables the gate: the next Builder runs `npm run verify:shippable`,
  gets "Missing script", and unless the orchestrator notices, proceeds ungated believing the
  gate ran. Any revert MUST therefore also set every node in goals/state.json whose
  depends_on includes N03e to status `blocked` with reason "verify:shippable reverted", in
  the same commit as the revert. A revert that does not touch state.json is incomplete.

  (2) If the synthetic Clerk probe user (C5) was created, delete it and append the deletion
  to goals/evidence/prod-audit-log.jsonl per INV-PROD-AUDITED:
      node scripts/verify/lib/clerk-session.mjs --delete-probe-user
  Leaving an orphan account in a four-account production Clerk instance corrupts exactly the
  roster review that N00b relied on to conclude there was no compromise.

# ─────────────────────────────────────────────────────────────────────────────
split_recommended: true
split: >
  TWO CONTRACTS, ONE CLEAN SEAM (D24). Split is RECOMMENDED, and N03e1 must go first.

  N03e1-edge-contract-tests  (6h) — contracts C8 and the gate2 half of C11.
    NEW tests for a deployable that has never been tested, living in a DIFFERENT codebase
    (~/projects/neurorvu-ios/api). Deliverables: api/tests/contract.test.mjs in the edge
    repo, api/package.json's scripts block, scripts/verify/edge-contract.test.mjs as the
    three-mode runner, the phi-regression injection, edge-contract.json.
    Its own done_when: the suite passes against api/ at its current sha with zero source
    change, and the phi-regression copy fails on exactly the PHI ids.
    This is a TESTING node for the second deployable. It is not a CI node.

  N03e2-shippable-harness    (8h) — contracts C1-C7, C9, C10, C12, C13 and the gate1/gate3
    halves of C11. The three-gate harness, the exit-code algebra, the pinned-blocked ratchet,
    the write guard, the header ratchet, flag-hygiene, the verdict artifact, the CI wiring.

  WHY THIS ORDER, AND WHY NOT BUNDLED: the harness cannot compose a gate whose tests do not
  exist — N03e2's gate 2 is literally a subprocess call into N03e1's runner. Bundling them
  hides real test-authoring work for a 130-line untested production service behind a CI
  title, and lets a Builder who runs out of budget ship the harness with gate 2 as a stub
  that exits 0. That concealment is exactly what D24 exists to prevent, and it would be
  concealed inside the one node every other node trusts.

# ─────────────────────────────────────────────────────────────────────────────
notes: >
  MISSING PREREQUISITE, flagged rather than absorbed. INV-CHECKS-ACTUALLY-RUN names
  `node scripts/verify/checks-are-executable.mjs`. That file does not exist — verified:
  `git ls-tree -r --name-only origin/main scripts/verify` lists fault-injection.mjs,
  log-correlation.mjs, monitor-roundtrip.mjs, monitor-sink.mjs, no-unredacted-path.mjs,
  phi-log-scan.mjs, prompt-cache-probe.mjs, rate-limit-probe.mjs, redaction-e2e.mjs,
  spend-cap-probe.mjs, harness/* and fixtures/*, and no checks-are-executable.mjs. The
  invariant that polices vacuous checks is itself currently a vacuous check. Writing it is a
  SECOND contract and is deliberately NOT absorbed here (D24). The Contractor should open
  N03f-checks-are-executable; until it lands, done_when's last entry is
  `blocked_dependency`, not satisfied and not waived.

  D38 — EXTEND, DO NOT REBUILD. scripts/verify/fault-injection.mjs already established the
  conventions this node adopts: BASE_URL, a JSON verdict under goals/evidence/<node-id>/,
  blockedExternal[] carrying {what, why, command}, and exit code 78. Reuse them literally
  rather than inventing a parallel vocabulary; two verification dialects in one scripts/verify
  directory is how the second one stops being read. scripts/verify/harness/server.mjs shows
  the existing node:http harness pattern for gate 2's adapter.

  FINDINGS TO HAND ONWARD, discovered while contracting and not in scope here:
    - /api/health is CDN-cached (x-vercel-cache: HIT, age 3275, not bustable by query string
      or Cache-Control: no-cache) and therefore cannot witness liveness. The fix —
      `export const dynamic = "force-dynamic"` or `Cache-Control: no-store` — belongs to
      N05-security-headers or a small node of its own. Gate 1 works around it with
      gate1.prod.origin-executes instead of waiting.
    - /api/health returns `access-control-allow-origin: *`. Route it to N05.
    - The edge API returns `{"error":"unauthorized"}` while the PWA returns the N00d envelope
      `{"error":{"code","correlationId"}}`. Two deployables, two error contracts, no
      correlation id on the edge side. Route to N00c-edge-usage-cap / N12; gate 2 pins the
      current shape so the change is visible when it happens.
    - resolve.js hardcodes the Anthropic base URL, which makes its two 502 branches
      untestable without either a source change or a network mock. N12 should introduce a
      configurable upstream base URL; note it on that node now, while the reason is fresh.

  WHAT MAKES THIS NODE PASS OR FAIL, in one sentence for the Builder: not that the three
  gates are green — today two of them cannot be fully green — but that the verdict tells a
  hostile reader exactly which assertions were made, which were not, and why, and that each
  gate has been proven capable of failing.

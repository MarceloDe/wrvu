     bd19a47..HEAD -- api/api api/lib api/data` is empty, and the suite still passes. This is
     what makes the tests a regression net for N12 rather than a rewrite (D38)."

  - "The gate-2 assertions that CANNOT run today are enumerated in the verdict as blocked

     additionally adds a seventh fixture of its own devising and confirms the scanner
     catches it, because a self-test that only passes against fixtures shipped with it
     proves less than it appears to."

  - "`npm run verify:shippable` is invocable as written in INVARIANTS.yaml — i.e.
     INVARIANTS.yaml no longer says `pnpm verify:shippable`, package.json declares
     packageManager, and running the command from a clean clone with `npm ci` works."

  - "checks-are-executable.mjs classifies INV-ALWAYS-SHIPPABLE's two cmds as RUNNABLE where

id: N02-real-migrations
title: Drizzle migrations become the single schema source
goal_refs: [G10]
decisions: [D19, D41, D42]
depends_on: []
phase: A1
estimate_hours: 8
priority: 1

written_after_execution: >
  Four earlier drafts were rejected — three by the loop, one hand-written by me. The
  recurring cause was writing verification I never ran, so contradictions survived: two
  runtime steps asserted mutually exclusive facts about the same database, and the whole
  strategy depended on creating a Neon branch, which is IMPOSSIBLE here (no neonctl, no
  API key — goals/DECISIONS.md). This draft describes only commands that have been
  EXECUTED, with their observed output. The baseline, the journal and the two checks below
  already exist and already pass.

rationale: >
  drizzle/0001_llm_usage.sql was applied to production BY HAND through a SQL console on
  2026-08-18 (goals/evidence/prod-audit-log.jsonl). There is no _migrations table, so
  nothing records that it ran. The schema of record is currently "what somebody typed".

already_delivered:
  - "drizzle/0000_baseline.sql — 20 statements, the public schema as it stood BEFORE 0001.
     Generated from the live schema with the 0001-owned objects removed, so 0000 + 0001
     reproduces the current schema exactly."
  - "drizzle/meta/_journal.json — 0000_baseline then 0001_llm_usage."
  - "scripts/verify/schema-diff.mjs and scripts/verify/migration-replay.mjs, both working."
  - "scripts/verify/_pg.mjs — ephemeral Postgres 17 via Docker, snapshot and diff."

remaining_contracts:
  - "lib/db/migrate.mjs applies pending migrations in journal order inside a transaction,
     records each in a `_migrations` table (name, checksum, applied_at), applies nothing on
     a second run and says 'nothing to apply', and REFUSES with a message NAMING the file
     when an already-applied migration's checksum no longer matches disk"
  - "lib/db/migrate.mjs takes --url-env VAR, never --url with an inline connection string —
     a URL in argv leaks into process listings and into error text"
  - "package.json gains db:migrate and db:migrate:check; db:push is REMOVED"
  - "drizzle/0001_llm_usage.down.sql exists, matching the rollback already in 0001's header"

invariants: [INV-PROD-AUDITED, INV-NO-SWALLOW, INV-CHECKS-ACTUALLY-RUN, INV-ALWAYS-SHIPPABLE]

verify:
  runtime:
    - "mkdir -p goals/evidence/N02-real-migrations"
    # OBSERVED: PASS — 'drizzle/0000_baseline.sql,drizzle/0001_llm_usage.sql and DATABASE_URL are identical'
    - "node --env-file=.env.local scripts/verify/schema-diff.mjs --left-sql drizzle/0000_baseline.sql,drizzle/0001_llm_usage.sql --right-env DATABASE_URL --out goals/evidence/N02-real-migrations/baseline-plus-0001-vs-live.json"
    # OBSERVED: FAIL with 13 differences — proves the check can fail, not just pass
    - "! node --env-file=.env.local scripts/verify/schema-diff.mjs --left-sql drizzle/0000_baseline.sql --right-env DATABASE_URL > goals/evidence/N02-real-migrations/baseline-alone-must-differ.txt 2>&1"
    # OBSERVED: PASS — 'replaying 2 migration(s) reproduces the reference schema exactly'
    - "node --env-file=.env.local scripts/verify/migration-replay.mjs --out goals/evidence/N02-real-migrations/replay.json"
    - "node -e \"const r=require('./goals/evidence/N02-real-migrations/replay.json'); if(r.applied!==2||r.differences.length){console.error(r);process.exit(1)}\""
    # Migrator behaviour. Each names its own evidence file; none uses a pipe.
    - "node --env-file=.env.local lib/db/migrate.mjs --url-env DATABASE_URL_UNPOOLED > goals/evidence/N02-real-migrations/migrate-first-run.txt 2>&1"
    - "node --env-file=.env.local lib/db/migrate.mjs --url-env DATABASE_URL_UNPOOLED > goals/evidence/N02-real-migrations/migrate-second-run.txt 2>&1"
    - "grep -q 'nothing to apply' goals/evidence/N02-real-migrations/migrate-second-run.txt"
    - "node --env-file=.env.local scripts/verify/checksum-guard.mjs --url-env DATABASE_URL_UNPOOLED --out goals/evidence/N02-real-migrations/checksum-guard.txt"
    - "npm run verify:shippable > goals/evidence/N02-real-migrations/shippable.txt 2>&1"
  static:
    - "test -f package.json && ! grep -q '\"db:push\"' package.json"
    - "test -f package.json && grep -q '\"db:migrate\"' package.json"
    - "test -f drizzle/0000_baseline.sql && test -s drizzle/0000_baseline.sql"
    - "test -f drizzle/0001_llm_usage.down.sql && test -s drizzle/0001_llm_usage.down.sql"
    - "test -f lib/db/migrate.mjs && grep -q '_migrations' lib/db/migrate.mjs"
    - "test -f lib/db/migrate.mjs && ! grep -qE '\\-\\-url[^-]' lib/db/migrate.mjs"
  evidence:
    - baseline-plus-0001-vs-live.json
    - baseline-alone-must-differ.txt
    - replay.json
    - migrate-first-run.txt
    - migrate-second-run.txt
    - checksum-guard.txt
    - shippable.txt

done_when:
  - "0000_baseline + 0001_llm_usage applied to an EMPTY Postgres reproduces the live schema with zero differences (replay.json)"
  - "0000_baseline ALONE does NOT reproduce it — the diff check demonstrably fails as well as passes"
  - "The migrator applies nothing on its second consecutive run and says 'nothing to apply'"
  - "Tampering with an already-applied migration makes the migrator exit non-zero AND name the file; a mere crash does not satisfy this"
  - "db:push is gone; db:migrate and db:migrate:check exist"
  - "verify:shippable exits zero"

blocked_external:
  - what: "Backfilling _migrations on the PRODUCTION branch."
    why: >
      No production connection string is reachable from this session — every integration
      secret exports as the literal [SENSITIVE] (goals/DECISIONS.md), and Neon branch
      creation for the required pre-mutation snapshot needs an API key that does not exist
      (verified: neonctl not installed, zero Neon creds in .env.local).
    operator_closes_with: |
      1. In the Neon console create a branch pre-N02-migrations-backfill from main
         (full data+schema, auto-delete never).
      2. In the SQL editor on branch main, run drizzle/0000_backfill_migrations.sql,
         which creates _migrations and INSERTs the two rows. It runs NO other DDL.
      3. Confirm: select name from _migrations order by name  ->  0000_baseline, 0001_llm_usage
      4. Confirm llm_usage and llm_rate_buckets are unchanged.
      5. Append ONE new line to goals/evidence/prod-audit-log.jsonl naming the snapshot
         branch and the outcome. It is append-only JSONL — a new line, never an edit to an
         existing entry.
    note: >
      The backfill must RECORD, never re-run: those two tables were created by hand on
      2026-08-18 and re-running their DDL is not the intent.

rollback: >
  drop table if exists _migrations;  — removes only the history table. The backfill touches
  no application schema. For a future bad migration, restore from the snapshot branch.

notes: >
  Replay runs against an EPHEMERAL LOCAL POSTGRES, not a Neon branch. That is deliberate,
  not a compromise: the question replay answers is "do these files produce this schema",
  which is a property of the SQL. It is real Postgres 17 in Docker, not a mock, and it
  removes a dependency this environment cannot satisfy.
  drizzle.config.js already resolves DATABASE_URL_UNPOOLED (main, c297b89) — pgBouncer
  breaks session-level DDL, so do not point it back at the pooled URL.

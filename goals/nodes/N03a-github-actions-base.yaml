id: N03a-github-actions-base
title: Run the existing checks on every PR — GitHub Actions base workflow for the PWA repo
goal_refs: [G10]
decisions: [D18, D20, D24, D33, D38]
depends_on: []
phase: A1
estimate_hours: 4
priority: 1
severity: process-gap
blocks: [N02b-migration-ci-check, N03b-eslint-invariant-rules, N03c-neon-branch-runner, N03e-verify-shippable]

rationale: >
  There is no `.github/` directory anywhere in MarceloDe/wrvu (`git ls-tree -r origin/main`
  returns nothing under that path; `gh workflow list` shows exactly one workflow, GitHub's own
  "Copilot Code Review"). Every check A0 paid for is therefore advisory. On origin/main
  (3b3a5f5) package.json ships eight real commands — `lint` (a genuine eslint invocation with
  --max-warnings=0, not `next lint`), `test:redaction`, `test:forged-attachment`,
  `test:llm-proxy-contract`, `test:error-envelope`, `test:route-contracts`, `build` — and each
  one runs only when a human remembers. Three PRs have merged to main this way.

  Worse than advisory: the repo cannot currently be built from a clean checkout at all.
  `git archive origin/main | tar -x` into an empty directory, then `npm ci`, fails with
  EUSAGE — "lock file's esbuild@0.19.12 does not satisfy esbuild@0.28.2 / Missing:
  playwright-core@1.62.1 from lock file". The A0 builders added `esbuild@^0.28.2` and
  `playwright-core@^1.62.1` to devDependencies (they are what `scripts/verify/harness/bundle.mjs`
  and the two browser suites import) and never committed the regenerated lockfile. Nobody
  noticed because nobody has ever installed this repo from scratch. The first CI run would
  have died on its first step; that fact is itself the argument for this node.

  Measured on 2026-08-18 in a clean checkout of origin/main (scratchpad, macOS, node 24.15.0),
  after one `npm install` to resync the lockfile and with DATABASE_URL, CLERK_SECRET_KEY and
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY all unset:

      npm run lint                    exit 0
      npx tsc --noEmit                exit 0
      npm run test:redaction          exit 0   30/30
      npm run test:forged-attachment  exit 0   16/16
      npm run test:llm-proxy-contract exit 0   29/29 static (live layer correctly reports SKIP)
      npm run test:error-envelope     exit 0   pass 6 / fail 0
      npm run test:route-contracts    exit 0   pass 9 / fail 0
      npm run build                   exit 0   all pages ƒ (dynamic); nothing prerenders Clerk

  So the whole base suite is green with ZERO secrets. That is the finding that shapes this
  node: `lib/db/index.js` builds its Neon client lazily inside a request, `app/page.js` and the
  sign-in/sign-up pages are dynamic, so no build-time credential is needed. A base job that
  references no secret therefore also passes on a fork PR of this PUBLIC repo. Anything that
  does need a credential (Neon branch, real Clerk session, preview deploy) is N02b/N03c/N03e.

context_query: >
  codegraph explore "package.json scripts lint test:redaction test:forged-attachment
  test:llm-proxy-contract test:error-envelope test:route-contracts tests/error-envelope.test.ts
  tests/route-contracts.test.mjs scripts/test/redaction.test.mjs scripts/verify/harness/chromium.mjs
  tsconfig eslintrc — what does each check command execute and what does it need from the environment"

state_of_the_repo_2026_08_18: >
  Verified against origin/main @ 3b3a5f5 and the GitHub API, not from memory:
    - .eslintrc.json: root, extends next/core-web-vitals, no-empty with allowEmptyCatch:false
    - tsconfig.json: strict true, noEmit true, allowJs true, checkJs false
    - .nvmrc: DOES NOT EXIST. package.json has NO engines field.
    - package-lock.json: lockfileVersion 3, OUT OF SYNC with package.json (see rationale)
    - tests/error-envelope.test.ts is TypeScript run by `node --test`; it needs a Node with
      unflagged type stripping (>= 22.18 / 24.x). Dev runs node 24.15.0, npm 12.0.2.
    - scripts/test/redaction.test.mjs and scripts/test/forged-attachment.test.mjs launch a REAL
      Chromium through playwright-core, which never downloads a browser:
      scripts/verify/harness/chromium.mjs:44 resolveChromium() checks CHROMIUM_EXECUTABLE, then
      ~/.cache/ms-playwright, then /usr/bin/google-chrome, /usr/bin/chromium, and throws if none.
      A runner without a browser fails loudly at that throw — but the workflow must not depend on
      an undeclared runner-image detail, so it pins the browser explicitly (see contracts).
    - gh api repos/MarceloDe/wrvu: visibility public, permissions.admin true, Actions enabled,
      allowed_actions "all", default_workflow_permissions "read".
    - gh api repos/MarceloDe/wrvu/branches/main/protection -> 404 "Branch not protected".
      main is currently unprotected: anything can merge, red or not.

contracts:
  - ".github/workflows/ci.yml exists on MarceloDe/wrvu main with:
     `on: {pull_request: {}, push: {branches: [main]}}`,
     `permissions: {contents: read}`,
     `concurrency: {group: ci-${{ github.workflow }}-${{ github.ref }}, cancel-in-progress: true}`"
  - "Exactly one job, with the job KEY `checks` (that key is the status-check context branch
     protection will name), `runs-on: ubuntu-latest`, `timeout-minutes: <= 20`, no `strategy.matrix`
     (a matrix would rename the context to `checks (x)` and silently unrequire it)"
  - "Setup steps, in order: actions/checkout@v4; actions/setup-node@v4 with
     `node-version-file: .nvmrc` and `cache: npm`; a step that prints `node -v` and `npm -v`;
     `npm ci`; a browser step that exports CHROMIUM_EXECUTABLE to $GITHUB_ENV and asserts
     `test -x \"$CHROMIUM_EXECUTABLE\"` in the same step, so a missing browser fails at a named
     step rather than inside a test"
  - "Then EIGHT discrete check steps, one command per step, in this order, each with a `name:`
     so a failure names itself:
       1 `npm run lint`
       2 `npx tsc --noEmit`
       3 `npm run test:redaction`
       4 `npm run test:forged-attachment`
       5 `npm run test:llm-proxy-contract`
       6 `npm run test:error-envelope`
       7 `npm run test:route-contracts`
       8 `npm run build`"
  - "No step in ci.yml carries `continue-on-error`, and no step carries an `if:` condition. A
     conditional check step is a check that can decline to run, which INV-CHECKS-ACTUALLY-RUN
     treats as broken, not satisfied."
  - "ci.yml contains no `secrets.` reference and no `pull_request_target` trigger. The repo is
     PUBLIC: pull_request_target would hand the repository's secrets to a fork PR."
  - ".nvmrc contains exactly one Node version of ONE major (24.x, matching dev's 24.15.0), and
     package.json gains `engines: { node: \">=24.15.0 <25\" }`. The pinned major must be one on
     which `node --test tests/error-envelope.test.ts` REPORTS `pass 6 / fail 0` — a version where
     that command errors on the .ts extension, or reports `tests 0` and exits 0, violates the
     contract; a vacuous 0-test pass is worse than no check (INV-CHECKS-ACTUALLY-RUN)."
  - "package-lock.json is regenerated and committed so that `npm ci` exits 0 in a checkout that
     has no node_modules, at the pinned Node. `npm ls esbuild playwright-core` resolves both.
     No dependency VERSION RANGE in package.json changes — this is a lockfile repair, not an
     upgrade: `git diff origin/main -- package.json` shows only the added `engines` block."
  - "scripts/test/redaction.test.mjs gains the zero-case guard that
     scripts/test/forged-attachment.test.mjs already has (`if (!results.length) { lines.push(...);
     failed += 1 }`). Today redaction.test.mjs increments `failed` only per failing case, so a
     suite that collected zero cases prints `0/0 passed` and exits 0 — a vacuous pass sitting
     directly on the PHI control."
  - "Branch protection on `main` requires the status check context `checks`:
     `gh api repos/MarceloDe/wrvu/branches/main/protection --jq '.required_status_checks.contexts'`
     contains `checks`."

invariants: [INV-CHECKS-ACTUALLY-RUN, INV-NO-SWALLOW, INV-ALWAYS-SHIPPABLE]

verification_environment: >
  Real GitHub Actions on MarceloDe/wrvu — never `act`, never a local re-run of the same npm
  scripts. The runner image, the Node install, the npm registry and the browser provisioning ARE
  the infrastructure under test (D20); a local pass proves nothing about any of them. All
  evidence is GitHub run ids, permanently re-readable by any fresh agent with
  `gh run view <id> -R MarceloDe/wrvu`. No credential beyond the operator's existing gh token is
  required: the token in use today has `repo` + `workflow` scope and `permissions.admin: true` on
  the repo, both verified 2026-08-18.

verify:
  runtime:
    - "cd $(mktemp -d) && git clone --depth 1 --branch builder/N03a-github-actions-base https://github.com/MarceloDe/wrvu . && npm ci
       # the lockfile repair: MUST exit 0. On origin/main today this exits 1 with EUSAGE."
    - "gh pr create --fill --head builder/N03a-github-actions-base --base main -R MarceloDe/wrvu"
    - "RUN=$(gh run list -R MarceloDe/wrvu --workflow ci.yml --branch builder/N03a-github-actions-base -L1 --json databaseId --jq '.[0].databaseId') && gh run watch $RUN -R MarceloDe/wrvu --exit-status"
    - "gh run view $RUN -R MarceloDe/wrvu --json databaseId,headSha,conclusion,jobs > goals/evidence/N03a-github-actions-base/ci-green-run.json"
    - "gh run view $RUN -R MarceloDe/wrvu --json jobs --jq '.jobs[0].steps[] | [.number, .conclusion, .name] | @tsv' | tee goals/evidence/N03a-github-actions-base/green-steps.tsv
       # must list all eight check steps with conclusion `success`; no `skipped`, no `neutral`"
    - "gh run view $RUN -R MarceloDe/wrvu --log | grep -nE 'node v|npm .*[0-9]+\\.[0-9]+|CHROMIUM_EXECUTABLE|30/30 passed|16/16 browser cases passed|29/29 static checks passed|pass 6|pass 9' | tee goals/evidence/N03a-github-actions-base/toolchain-and-counts.txt
       # the green run's own log must show the real case counts — proof the suites ran, not that they exited 0"
    - "POISON A (lint / INV-NO-SWALLOW): on throwaway branch poison/N03a-lint, add lib/poison-lint.js
       containing `export function poison() { try { JSON.parse(\"x\"); } catch {} }`, open a draft PR,
       and record the run. Pre-validated locally 2026-08-18: eslint reports `2:34 error Empty block
       statement no-empty`, exit 1. Expected: run conclusion `failure`, failing step `npm run lint`."
    - "POISON B (typecheck): on throwaway branch poison/N03a-typecheck, edit tests/error-envelope.test.ts
       line 16 `fail(\"internal_error\", \"cid-123\", 500)` -> `fail(\"internal_error\", \"cid-123\", \"500\")`.
       Pre-validated locally: `tsc --noEmit` exits 2 with
       `tests/error-envelope.test.ts(16,49): error TS2345: Argument of type 'string' is not assignable
       to parameter of type 'number'`, while `npm run lint` still exits 0 — so the failure can only be
       attributed to step 2. Expected: run conclusion `failure`, failing step `npx tsc --noEmit`."
    - "POISON C (a real test, in a real browser): on throwaway branch poison/N03a-redaction, in
       scripts/test/redaction.browser.js line 78 change the expected rect
       `{ id: \"name\", x: 50, y: 100, w: 50, h: 100 }` -> `w: 49`. Pre-validated locally: the suite
       prints `FAIL resolveRegions converts 0..1 fractions to clamped pixel rectangles`, `29/30 passed`,
       exit 1, and lint stays 0. Expected: run conclusion `failure`, failing step `npm run test:redaction`,
       and the log must contain `29/30 passed` — a string that can only be produced inside a real
       Chromium on the runner, which is simultaneously the proof that browser provisioning works."
    - "for b in lint typecheck redaction; do gh run list -R MarceloDe/wrvu --branch poison/N03a-$b -L1 --json databaseId,conclusion --jq '.[0]'; done
       # three ids, all conclusion `failure`; then close the draft PRs and delete the three branches — the run ids survive deletion and remain the evidence"
    - "gh api repos/MarceloDe/wrvu/branches/main/protection > goals/evidence/N03a-github-actions-base/branch-protection.json && gh api repos/MarceloDe/wrvu/branches/main/protection --jq '.required_status_checks.contexts' | grep -q '\"checks\"'"
    - "gh api repos/MarceloDe/wrvu/actions/permissions --jq '.enabled' | grep -qx true"
  static:
    - "! grep -rn 'pull_request_target' .github/"
    - "! grep -n 'secrets\\.' .github/workflows/ci.yml"
    - "! grep -n 'continue-on-error' .github/workflows/ci.yml"
    - "! grep -nE '^\\s+if:' .github/workflows/ci.yml"
    - "! grep -n 'matrix' .github/workflows/ci.yml"
    - "test -f .nvmrc && test $(wc -l < .nvmrc) -le 1 && grep -qE '^v?24\\.' .nvmrc"
    - "node -e \"const p=require('./package.json'); if(!p.engines||!p.engines.node) process.exit(1)\""
    - "for s in 'npm run lint' 'npx tsc --noEmit' 'npm run test:redaction' 'npm run test:forged-attachment' 'npm run test:llm-proxy-contract' 'npm run test:error-envelope' 'npm run test:route-contracts' 'npm run build'; do grep -qF \"$s\" .github/workflows/ci.yml || { echo \"MISSING STEP: $s\"; exit 1; }; done"
    - "git diff origin/main -- package.json | grep -E '^[-+]\\s+\\\"(next|react|eslint|typescript|esbuild|playwright-core|drizzle)' && exit 1 || true   # lockfile repair must not move any dependency range"
  manual: []
  evidence:
    - ci-green-run.json
    - green-steps.tsv
    - toolchain-and-counts.txt
    - npm-ci-clean-checkout.txt
    - poison-lint-run.json
    - poison-typecheck-run.json
    - poison-redaction-run.json
    - branch-protection.json

done_when:
  - "A named GitHub Actions run id on a real PR in MarceloDe/wrvu has `conclusion: success`, and
     `gh run view <id> --json jobs` lists all eight check steps with conclusion `success` — none
     `skipped`, none `neutral`, none carrying continue-on-error."
  - "That same green run's log contains the literal strings `30/30 passed`,
     `16/16 browser cases passed`, `29/29 static checks passed`, `pass 6` and `pass 9`. Every gate
     therefore executed its real case count on the runner; none of them exited 0 on zero work."
  - "Three named run ids, one per gate, have `conclusion: failure`, and `gh run view <id> --json jobs`
     shows the failure at step `npm run lint`, at step `npx tsc --noEmit`, and at step
     `npm run test:redaction` respectively. A fresh agent re-derives which step failed from the run
     record alone, without trusting the Builder and without re-running anything."
  - "`git clone --depth 1` of main into an empty directory followed by `npm ci` exits 0. (Run the
     same two commands against 3b3a5f5 to see it exit 1 with EUSAGE — that contrast is the check.)"
  - "`gh api repos/MarceloDe/wrvu/branches/main/protection --jq '.required_status_checks.contexts'`
     contains `checks`, where it returned HTTP 404 `Branch not protected` before this node."
  - "`grep -rn pull_request_target .github/` returns nothing, and `grep -n 'secrets\\.'
     .github/workflows/ci.yml` returns nothing — so the green run is reproducible from a fork and no
     fork PR can reach a repository secret."
  - "`node --test tests/error-envelope.test.ts` on the version in .nvmrc reports `pass 6 / fail 0`,
     not `tests 0`, and package.json `engines.node` names the same major."
  - "scripts/test/redaction.test.mjs exits non-zero when its browser suite collects zero cases
     (assert by temporarily returning `[]` from window.__runRedactionTests locally, or by reading the
     added guard). Today it exits 0."

rollback: >
  Repo metadata only — no deployable, no database, no environment variable is touched, so
  INV-PROD-AUDITED's production rails do not apply and no Neon snapshot is required.
  To undo: `git rm .github/workflows/ci.yml` (or revert the merge commit), and
  `gh api -X DELETE repos/MarceloDe/wrvu/branches/main/protection` to drop the required check.
  Two caveats, both deliberate: (1) the regenerated package-lock.json should NOT be reverted —
  reverting it restores a repo that cannot `npm ci`; (2) if CI turns out to be flaky, the fix is
  to fix the flake, never to add `continue-on-error`, which converts the gate back into decoration.

blocked_external: >
  None expected. Branch protection needs admin on MarceloDe/wrvu and the current token has it
  (`permissions.admin: true`, scopes `repo, workflow`, verified 2026-08-18). If the Builder's token
  differs, land the workflow anyway — the green run and the three poison runs still count — and hand
  the operator this exact call, then mark only the protection done_when as operator-pending:

    gh api -X PUT repos/MarceloDe/wrvu/branches/main/protection \
      -H "Accept: application/vnd.github+json" \
      -f 'required_status_checks[strict]=true' \
      -f 'required_status_checks[contexts][]=checks' \
      -F 'enforce_admins=false' \
      -F 'required_pull_request_reviews=null' \
      -F 'restrictions=null'

split_assessment: >
  NOT split. One contract: "every PR to this repo runs the eight existing checks, and a red one
  cannot merge." The workflow file alone is advisory — a check nobody is required to pass is the
  same class of defect as a check that cannot fail — so branch protection is the same contract's
  enforcement half, not a second contract. The considered seam was the lockfile repair, which is
  arguably its own node; it is folded in because `npm ci` is step one of the workflow and the node
  has no green run without it, and splitting would produce a node whose only deliverable is a file
  nobody can observe until this one lands. The genuine second contracts are already separate nodes:
  N03b (custom ESLint invariant rules), N03c (Neon-branch job), N02b (migration check), N03d (macOS
  runner), N03e (INV-ALWAYS-SHIPPABLE harness).

notes: >
  D38, improve never rebuild: do not rewrite, "modernize" or reorder any npm script, test file or
  config. The only source edits in scope are (a) the regenerated lockfile, (b) `engines` in
  package.json, (c) .nvmrc, (d) the two-line zero-case guard in scripts/test/redaction.test.mjs.
  Everything else is the new workflow file.

  Browser provisioning is the one runner-image risk. ubuntu-latest ships Google Chrome at
  /usr/bin/google-chrome, which resolveChromium() would find on its own — but relying on an
  undeclared image detail is exactly the kind of check that silently changes meaning when the image
  changes, so set CHROMIUM_EXECUTABLE explicitly and assert `test -x` on it in the same step. If
  Chromium refuses to launch under the runner's sandbox, fix it with launch args in the harness, not
  by skipping the two browser suites — they are the N00f/N00c PHI gates.

  npm 12 does not run dependency lifecycle scripts without approval. esbuild and playwright-core
  both ship prebuilt binaries in their platform packages and worked without their postinstall in the
  local clean-checkout probe, but if `npm ci` on the runner leaves esbuild unable to bundle, the
  redaction step fails loudly at `buildHarnessBundle` — that is a real failure to fix, not a step to
  skip.

  The check suites write evidence files under goals/evidence/ as a side effect
  (llm-proxy-contract.json, redaction-unit-tests.txt, forged-attachment-blocked.txt). CI must not
  commit them and must not add a `git diff --exit-code` cleanliness gate that these writes would trip.

  Out of scope, deliberately, and each already owned elsewhere: preview deploys (Vercel already
  builds every push; G10.7's "preview deploys on every PR" half is satisfied by the existing
  integration and re-verified in N03e), any job needing DATABASE_URL or a Clerk session (N03c),
  scripts/verify/* probes that need a running server (N03c), and the iOS/edge repos (N03d).

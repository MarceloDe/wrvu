    - replay-guard-refusals.txt          # the two exit-13 runs
    - migrate-guard-refusals.txt         # exit 3 pooled, exit 2 no-url
    - baseline-stamp.txt                 # dry-run, stamp, exit-4 refusal, and the applied-0 proof
    - dev-inventory-before.json
    - dev-inventory-after.json
    - prod-table-inventory-before.json
    - prod-table-inventory-after.json

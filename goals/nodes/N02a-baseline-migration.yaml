# ─────────────────────────────────────────────────────────────────────────────
done_when:

  - "1. drizzle/meta/_journal.json holds exactly two entries — idx 0 tag 0000_baseline, idx 1
        tag 0001_llm_usage — with entries[1].when strictly greater than entries[0].when, and
        `git hash-object drizzle/0001_llm_usage.sql` prints
        dfcf9e396acf7162ca3dd2e95a9857f5d940ec51, the blob already on origin/main. The
        Validator re-derives this from the file and from git, trusting no one."

  - "2. `node scripts/db/verify-baseline-provenance.mjs` exits 0 against the live database:
        re-introspecting it and applying the two documented text transforms reproduces
        drizzle/0000_baseline.sql byte for byte. `--self-test` also exits 0, proving the
        comparison detects a one-byte mutation. A hand-written baseline fails item 2."

  - "3. From an empty public schema on the real dev Neon branch, `migration-replay.mjs
        --allow-drop-public` prints exactly `applied 2 migrations`, exits 0, and its report
        records match: true — the normalized pg_dump of the replayed schema equals
        drizzle/meta/baseline.pg.sql. The Validator re-runs it and reads the diff artifact,
        which must be empty AND must not be empty for the trivial reason: replay-dump.sql
        contains 9 CREATE TABLE statements, 5 indexes and rvu_codes_table_id_fkey."

  - "4. On a clean tree `drizzle-kit check` prints \"Everything's fine\" and
        `drizzle-kit generate` prints \"No schema changes, nothing to migrate\", writing no
        file — confirmed by `git add --intent-to-add -A drizzle/ && git diff --exit-code
        drizzle/` exiting 0. lib/db/schema.js, drizzle/ and the live database therefore
        describe one schema. (Before this node the same commands emit a fifteen-statement
        migration; that is the measured starting point, recorded above.)"

  - "5. No committed file under drizzle/ and no output of any command in verify.runtime
        contains the string `neon_auth`, and `drizzle-kit pull` against a database carrying
        the nine neon_auth tables is shown fetching exactly 9 tables — the public ones —
        with schemaFilter [\"public\"] present in drizzle.config.js."

  - "6. `npm run db:push` no longer exists: `node -e \"require('./package.json').scripts['db:push']\"`
        yields undefined, and grep finds no `drizzle-kit push` in package.json, scripts/,
        .github/, README.md."

  - "7. The runner refuses what it must: exit 3 on the pooled host (`-pooler.`), exit 2 with
        no unpooled string. The stamp refuses what it must: exit 4 on a non-empty
        __drizzle_migrations, exit 6 on an empty public schema. Each refusal is a recorded
        exit code from a real run against the real branch, in
        migrate-guard-refusals.txt / baseline-stamp.txt."

  - "8. On the dev branch, after `db:baseline`, `node scripts/db/migrate.mjs` prints
        `applied 0 migrations, 2 already present`. This is the stamp's correctness proof: it
        can only hold if every created_at equals its journal `when`, since PgDialect.migrate
        selects by timestamp."

  - "9. Production carries drizzle.__drizzle_migrations with exactly two rows whose hashes
        are sha256(0000_baseline.sql) and
        b9d4757d4eff0049419ac9092391724a11fcafd40e2f622479a5105bf3edb4b0, and
        `scripts/db/migrate.mjs` against production prints `applied 0 migrations, 2 already
        present`. prod-table-inventory-before.json and prod-table-inventory-after.json list
        the same nine public table names with identical row counts (G12.1 — this node moves
        no data). The audit line for the stamp exists in goals/evidence/prod-audit-log.jsonl
        and names the pre-N02a-baseline snapshot branch."

  - "10. All three deployables still work: `next build` passes and the A0 suites
        (test:redaction, test:forged-attachment, test:llm-proxy-contract, test:error-envelope,
        test:route-contracts, lint) are green. Nothing in the app reads drizzle/ at runtime,
        so this is a fast check rather than a hopeful one."

# ─────────────────────────────────────────────────────────────────────────────
rollback: >
  Two production touches, both non-destructive, both reversible.

  (a) `drizzle-kit pull` / table-inventory / verify-baseline-provenance against production —
      read-only introspection and count queries. Nothing to roll back.

  (b) `db:baseline` — creates schema `drizzle` and one table, inserts two rows, and executes
      no DDL against any pre-existing object. Roll back with
      `drop schema drizzle cascade;`, which returns production to exactly its present state:
      no migrations table, no history. If the stamp itself is wrong (step 6 of the manual
      procedure prints anything other than `applied 0 migrations, 2 already present`) drop
      the schema and stop — do NOT let db:migrate run, because with a bad stamp it would
      attempt 0000's CREATE TABLE statements over live tables. They carry IF NOT EXISTS, so
      even that failure mode is inert, but it must not be relied on.
      The `pre-N02a-baseline` snapshot branch (full data+schema, auto-delete never) is the
      belt-and-braces path.

  Repository side: revert the pull request. No runtime code path reads drizzle/, the
  lib/db/schema.js edit changes constraint NAMES only and no emitted query, and restoring
  `db:push` is a one-line revert. No user row is touched anywhere in this node.

# ─────────────────────────────────────────────────────────────────────────────
notes: >
  Branch from origin/main (3b3a5f5). The local checkout of main is eight commits behind and
  its package.json predates A0 (D38: start from the working code, never the stale copy).

  The `psql-free-drop-migrations.mjs` line in verify.runtime step 5 is shorthand for the one
  setup the Builder must do to exercise the stamp honestly: the replay in step 3 leaves the
  dev branch with a POPULATED __drizzle_migrations, so it must be cleared
  (`drop schema drizzle cascade` on the dev branch) before db:baseline can be shown refusing
  and then succeeding. Do that with a one-off command; do not add a script whose only
  purpose is deleting migration history — that script would eventually be pointed at
  production.

  Order the Builder should work in, because two steps are cheap to get wrong:
    1. pull into a TEMP directory, not into drizzle/ — pull also writes schema.ts and
       relations.ts, and a stray second schema declaration in the repo is INV-NO-DEAD-CODE.
    2. Apply the two text transforms, then take drizzle/meta/baseline.pg.sql from the docker
       pg_dump BEFORE anything destructive happens.
    3. Delete the nine opclass keys from 0000_snapshot.json and add the two constraint names
       to lib/db/schema.js in the same step — `drizzle-kit generate` staying silent is the
       signal that both halves are right, and it is silent only when both are done.
    4. Only then write the journal's 0001 entry and copy 0001_snapshot.json.

  What is deliberately NOT here:
    - neon_auth is dead weight in this product (INV-NO-DEAD-CODE, advisory). Do not drop it.
      Dropping nine tables belonging to a Vercel/Neon integration is a destructive action
      outside this contract; open a remediation node.
    - The `users` table is also unread by application code. Same answer: it is in the
      baseline because it is in the database, and removing it is a different node.
    - No constraint is renamed in production. The convergence is achieved by making
      lib/db/schema.js tell the truth about the names production already has, which is
      strictly cheaper and strictly safer than ALTER TABLE against live tables.

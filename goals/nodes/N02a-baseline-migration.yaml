  manual:
    - name: production-baseline-stamp
      why: >
        No production connection string is reachable from this session — `vercel env pull`
        writes [SENSITIVE] for every integration secret and .env.local carries the dev branch
        only. The stamp is the one step an operator (or an orchestrator holding a production
        route) must run. It is non-destructive and fully scripted; nothing here is a judgement call.
      procedure:
        - "1. Neon console: create branch `pre-N02a-baseline` from main (br-jolly-violet-atsaugx3),
              full data+schema, auto-delete Never. Record the branch id."
        - "2. node scripts/db/table-inventory.mjs --url \"$PROD_UNPOOLED\" --out goals/evidence/N02a-baseline-migration/prod-table-inventory-before.json"
        - "3. node scripts/db/verify-baseline-provenance.mjs --url \"$PROD_UNPOOLED\"
              # proves the committed baseline describes PRODUCTION, not only the dev branch. Exit 0 required before step 5."
        - "4. node scripts/db/baseline.mjs --url \"$PROD_UNPOOLED\" --dry-run"
        - "5. node scripts/db/baseline.mjs --url \"$PROD_UNPOOLED\""
        - "6. node scripts/db/migrate.mjs --url \"$PROD_UNPOOLED\"
              # MUST print 'applied 0 migrations, 2 already present'. Anything else: roll back per (b) below."
        - "7. node scripts/db/table-inventory.mjs --url \"$PROD_UNPOOLED\" --out goals/evidence/N02a-baseline-migration/prod-table-inventory-after.json"
        - "8. Append one line to goals/evidence/prod-audit-log.jsonl:
              {ts, actor, node: \"N02a-baseline-migration\", action: \"baseline stamp (no DDL against existing objects)\",
               target: \"neon-almond-leaf / branch main (br-jolly-violet-atsaugx3) / neondb\",
               statements: [\"create schema if not exists drizzle\", \"create table if not exists drizzle.__drizzle_migrations(...)\",
                            \"insert 2 rows\"], additive_only: true, destructive_statements: 0,
               snapshot: {branch: \"pre-N02a-baseline\", id: \"<id>\", type: \"full data and schema from main\", auto_delete: \"never\"},
               result: \"<step 6 output>\", rollback: \"drop schema drizzle cascade;\", authorised_by: \"D25\"}"

  evidence:
    - pull-raw.sql                       # untouched drizzle-kit pull output
    - baseline-edits.md                  # the three transforms, with the diff pull-raw -> 0000_baseline.sql
    - baseline-provenance.txt            # both provenance runs, including --self-test
    - drizzle-check.txt
    - drizzle-generate-clean.txt         # "No schema changes, nothing to migrate" + empty git diff
    - replay-dump.sql

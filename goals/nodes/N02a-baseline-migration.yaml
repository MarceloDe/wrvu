id: N02a-baseline-migration
title: Baseline the live schema as drizzle/0000, register the hand-applied 0001, and delete db:push
goal_refs: [G10, G10.6, G12.1]
decisions: [D19, D20, D24, D25, D38, D39]
depends_on: [N03a-github-actions-base]
phase: A1
estimate_hours: 6
priority: 1
severity: silent-decay
couples_with: [N02b-migration-ci-check]     # BACKLOG `couples:` — ONE pull request

# ─────────────────────────────────────────────────────────────────────────────
rationale: >
  There is no migration history for this product. drizzle.config.js:28-33 declares
  `out: "./drizzle"`; on origin/main that directory holds exactly one file,
  drizzle/0001_llm_usage.sql, and no meta/_journal.json — verified:
  `git cat-file -e origin/main:drizzle/meta/_journal.json` fails. drizzle-orm's
  readMigrationFiles (node_modules/drizzle-orm/migrator.cjs) throws
  "Can't find meta/_journal.json file" on exactly that layout, so the directory is not a
  migrations folder at all — it is one loose SQL file that was applied to production by
  hand during N00c (goals/evidence/prod-audit-log.jsonl, 2026-08-18T13:53).

  The only wired-up schema mechanism is package.json:10, `"db:push": "drizzle-kit push"`,
  which diffs lib/db/schema.js straight into the live database, writes no file, records no
  history and offers no down path. README.md:185 and scripts/seed.mjs:2 both teach it as
  the normal workflow. Every schema change this product has ever made went that way, which
  is why the production schema exists only inside Neon and nowhere in git. No
  __drizzle_migrations table exists on any branch.

  G10.6 asks for "Drizzle migrations are the single schema source ... with a rollback
  path". Today the source of truth is a database, the history is a hand-note in an audit
  log, and the rollback path is a Neon branch snapshot somebody remembered to take.

# ─────────────────────────────────────────────────────────────────────────────
# Everything below this line was executed against the real dev Neon branch and the real
# toolchain on 2026-08-18, not inferred. Each item names how it was established, because
# three of them contradict the BACKLOG entry that opened this node.
discovery_2026_08_18:

  live_shape: >
    br-late-paper-at5h75si (Postgres 17.10, a branch of production main) holds 18 base
    tables in two schemas: 9 in public — users, user_kv, rvu_tables, exams,
    extra_duty_periods, extra_duty_rates, rvu_codes, llm_usage, llm_rate_buckets — and 9 in
    neon_auth (account, invitation, jwks, member, organization, project_config, session,
    user, verification), installed by the Neon Auth integration and read by nothing in this
    codebase (auth is Clerk, D39). Only extension: plpgsql. state.json's "15 tables" is
    wrong; the figure is 18 across two schemas. All nine public tables are declared in
    lib/db/schema.js (167 lines on origin/main) — there is no structural drift in public.

  neon_auth_hazard_is_narrower_than_the_backlog_claimed: >
    The BACKLOG said `drizzle-kit generate` could emit DROP TABLE for the neon_auth tables.
    It cannot. Two things were measured:
      (1) drizzle-kit 0.28.1 `generate` NEVER opens a database connection. Proven by running
          it with DATABASE_URL and DATABASE_URL_UNPOOLED unset and a config carrying no
          dbCredentials at all: it read the schema file, wrote 0000_offline-probe.sql and
          exited 0. `check` is likewise offline. Only push / pull / studio connect.
      (2) `drizzle-kit pull` against the dev branch WITHOUT any schemaFilter fetched
          "9 tables, 71 columns, 5 indexes, 1 foreign keys, 0 enums, 0 views, 0 policies,
          0 check constraints" and its output contains zero occurrences of the string
          neon_auth. drizzle-kit's default schemaFilter is already ["public"].
    So the live hazard was never `generate`; it was `drizzle-kit push`, which this node
    deletes, plus any future widening of schemaFilter. schemaFilter is still set explicitly
    below — an implicit default that protects a production integration should be written
    down — but it is contracted as belt-and-braces with a test, not as the fix for an active
    bug, and this node says so rather than inheriting a wrong premise.

  pull_output_is_inert_as_shipped: >
    `drizzle-kit pull` writes 0000_<two_random_words>.sql, schema.ts, relations.ts,
    meta/_journal.json and meta/0000_snapshot.json. The SQL file is ENTIRELY WRAPPED in a
    /* ... */ block under a two-line header reading "If you want to run this migration
    please uncomment this code before executing migrations". Committed unmodified, the
    baseline replays as a no-op and the from-zero replay would produce an empty database.

  pull_emits_index_ddl_postgres_rejects: >
    pull renders index columns with opclass tokens, and gets them wrong for non-text
    columns: `CREATE INDEX "exams_user_date_idx" ON "exams" USING btree ("user_id"
    text_ops,"exam_date" text_ops)`. Executed against the real branch this fails —
    `operator class "text_ops" does not accept data type timestamp with time zone` —
    measured directly, alongside the timestamptz_ops form which succeeds. Three of the five
    indexes are affected (exams_user_date_idx, extra_duty_user_date_idx,
    llm_usage_user_created_idx). The LIVE indexes carry no opclass at all, confirmed by
    pg_dump: `CREATE INDEX exams_user_date_idx ON public.exams USING btree (user_id,
    exam_date)`. Deleting the opclass tokens therefore reproduces the live objects exactly.

  a_pull_baseline_alone_does_not_converge: >
    With the pull snapshot registered and lib/db/schema.js untouched, `drizzle-kit generate`
    emits a fifteen-statement migration: DROP/ADD the rvu_codes foreign key
    (rvu_codes_table_id_fkey -> rvu_codes_table_id_rvu_tables_id_fk), DROP/ADD the user_kv
    primary key (user_kv_pkey -> user_kv_user_id_key_pk), and DROP+CREATE all five indexes.
    None of that is structural. It is drizzle's naming convention disagreeing with the
    pg-default names production actually carries, plus the opclass metadata above. Shipping
    it would mean running constraint DDL against production to satisfy a naming convention.

  the_convergent_fix_verified_end_to_end: >
    Measured on 2026-08-18, in this order: register the pull baseline; delete the nine
    "opclass" keys from meta/0000_snapshot.json; name the two constraints explicitly in
    lib/db/schema.js — primaryKey({ name: "user_kv_pkey", ... }) and a table-level
    foreignKey({ ..., name: "rvu_codes_table_id_fkey" }).onDelete("cascade"); append the
    0001 journal entry and its snapshot. Result: `drizzle-kit check` prints "Everything's
    fine", `drizzle-kit generate` prints "No schema changes, nothing to migrate" and exits
    0 having written no file. Zero DDL against production, zero rows moved, and the
    recorded history reproduces production's real object names.

  migrator_mechanics_that_the_stamp_must_match: >
    drizzle-orm 0.36.4. readMigrationFiles (node_modules/drizzle-orm/migrator.cjs) computes
    `hash = sha256(entire file text)` per journal entry and carries `folderMillis =
    entry.when`. PgDialect.migrate (node_modules/drizzle-orm/pg-core/dialect.cjs:46-72) runs
    `CREATE SCHEMA IF NOT EXISTS "drizzle"`, then
    `CREATE TABLE IF NOT EXISTS "drizzle"."__drizzle_migrations" (id SERIAL PRIMARY KEY,
    hash text NOT NULL, created_at bigint)`, reads the single row with the greatest
    created_at, and applies a migration only when `created_at < folderMillis`. Selection is
    by TIMESTAMP, not by hash. Two consequences are contractual, not stylistic: journal
    `when` values must strictly increase with idx, and a stamp is correct if and only if its
    created_at values equal the journal's `when` values.
    The migrator also wraps the run in `session.transaction`, which the neon-http driver
    used by lib/db/index.js:16-17 cannot do. The runner needs a transaction-capable driver.

  toolchain_facts: >
    Host pg_dump is 16.13 (/opt/homebrew/opt/postgresql@16/bin/pg_dump) and refuses a
    17.10 server, so the baseline dump cannot be taken with the host binary. The postgres:17
    image is ALREADY present locally (docker 29.2.1) and
    `docker run --rm -e PGURL="$URL" postgres:17 sh -c 'pg_dump "$PGURL" --schema-only
    --no-owner --no-privileges -n public'` produced a real 303-line 17.10 dump of the dev
    branch containing 9 CREATE TABLE, 9 *_pkey constraints, 5 indexes and
    `rvu_codes_table_id_fkey ... ON DELETE CASCADE`. That dump also carries a `\restrict`
    psql meta-command whose token is randomised per run — which is why N02b's normalizer
    strips it and why an un-normalized diff of two dumps can never be empty.
    Connection hosts on the dev branch: unpooled
    ep-damp-hill-atuwz5ih.c-9.us-east-1.aws.neon.tech, pooled
    ep-damp-hill-atuwz5ih-pooler.c-9.us-east-1.aws.neon.tech. The `-pooler.` substring is
    the discriminator the runner refuses on.
    Node is v24.15.0; @neondatabase/serverless Pool opens a real transaction over the
    unpooled host with no `ws` shim (measured). `pg` is not yet a dependency.

  repo_state: >
    The local checkout of main is EIGHT commits behind origin/main and its package.json
    predates the A0 work. Branch from origin/main (3b3a5f5), never from the local tree.
    origin/main:drizzle/0001_llm_usage.sql — blob dfcf9e396acf7162ca3dd2e95a9857f5d940ec51,
    989 bytes, sha256 b9d4757d4eff0049419ac9092391724a11fcafd40e2f622479a5105bf3edb4b0.
    Every statement in it is `create table if not exists` / `create index if not exists`, so
    replaying it immediately after a baseline that already contains those objects is a
    proven no-op rather than a hoped-for one.

# ─────────────────────────────────────────────────────────────────────────────
context_query: >
  codegraph explore "drizzle.config.js migrationUrl DATABASE_URL_UNPOOLED lib/db/schema.js
  users userKv rvuTables exams extraDutyPeriods extraDutyRates rvuCodes llmUsage
  llmRateBuckets lib/db/index.js scripts/seed.mjs — how is the Drizzle schema declared,
  what connects to Postgres, and what applies schema changes today"

# ─────────────────────────────────────────────────────────────────────────────
split_recommended:
  recommended: false
  seam: >
    The defensible cut is between the ARTIFACTS (config, 0000, journal, snapshots,
    schema.js constraint names, the runner, removing db:push) and the PRODUCTION STAMP
    (scripts/db/baseline.mjs plus the audited run against production). They are one
    contract here — "the recorded migration history is the schema source and it describes
    production exactly" — because a baseline that production has not been stamped with is
    not a baseline: the next `db:migrate` against production would try to CREATE TABLE over
    live tables. The stamp is what makes the artifacts true of production. Splitting yields
    a first node whose done_when is "we wrote some files".
    If the orchestrator splits anyway, cut there and carry rollback (b) with the second half.

# ─────────────────────────────────────────────────────────────────────────────
contracts:

  # ---- drizzle.config.js ----------------------------------------------------
  - "drizzle.config.js keeps its existing migrationUrl resolution (lines 8-26) unchanged and
     adds two keys to the default export: `schemaFilter: [\"public\"]` and
     `migrations: { table: \"__drizzle_migrations\", schema: \"drizzle\" }`. The second is a
     no-op restatement of drizzle-orm's defaults and exists so the stamp script and the
     runner read one declaration instead of two literals."

  # ---- drizzle/0000_baseline.sql -------------------------------------------
  - "drizzle/0000_baseline.sql is the output of `drizzle-kit pull` against the live schema,
     with EXACTLY three mechanical transforms and no others:
       (a) the two leading `-- Current sql file was generated...` comment lines and the
           enclosing `/*` ... `*/` wrapper are removed;
       (b) every opclass token inside a CREATE INDEX column list is deleted, so
           `(\"user_id\" text_ops,\"exam_date\" text_ops)` becomes `(\"user_id\",\"exam_date\")`;
       (c) the file is renamed from pull's random `0000_<word>_<word>.sql` to 0000_baseline.sql.
     It is never hand-authored from lib/db/schema.js. After the transforms it contains
     exactly 9 `CREATE TABLE IF NOT EXISTS`, 5 `CREATE INDEX IF NOT EXISTS`, one DO-block
     adding `rvu_codes_table_id_fkey ... ON DELETE cascade`, zero occurrences of `/*`, zero
     occurrences of `_ops`, and zero occurrences of `neon_auth`."

  # ---- drizzle/0001_llm_usage.sql ------------------------------------------
  - "drizzle/0001_llm_usage.sql is byte-identical to origin/main: git blob
     dfcf9e396acf7162ca3dd2e95a9857f5d940ec51, 989 bytes, sha256
     b9d4757d4eff0049419ac9092391724a11fcafd40e2f622479a5105bf3edb4b0. It is already applied
     in production; rewriting it — including reformatting or adding a comment — would make
     the recorded history a lie about a database that has already run it (D38, and N02b's
     migration-immutable check)."

  # ---- drizzle/meta ---------------------------------------------------------
  - "drizzle/meta/_journal.json is `{ version: \"7\", dialect: \"postgresql\", entries: [
       { idx: 0, version: \"7\", when: <ms>, tag: \"0000_baseline\",  breakpoints: true },
       { idx: 1, version: \"7\", when: <ms>, tag: \"0001_llm_usage\", breakpoints: true } ] }`
     with entries[1].when > entries[0].when. Strict increase is required by
     PgDialect.migrate, which selects by created_at, not by hash."

  - "drizzle/meta/0000_snapshot.json is pull's snapshot with every `opclass` key deleted from
     every index column (nine deletions across five indexes) and nothing else changed.
     drizzle/meta/0001_snapshot.json is a copy of it with a fresh uuid `id` and `prevId` set
     to 0000's `id`. 0001 adds no object that 0000 does not already contain, so the two
     snapshots are otherwise identical, and that is correct rather than lazy."

  - "drizzle/schema.ts and drizzle/relations.ts — also written by `drizzle-kit pull` — are
     NOT committed. lib/db/schema.js stays the single schema declaration (INV-NO-DEAD-CODE)."

  - "drizzle/meta/baseline.pg.sql is the normalized pg_dump of the live schema, produced by
     `docker run --rm -e PGURL=\"$DATABASE_URL_UNPOOLED\" postgres:17 sh -c 'pg_dump \"$PGURL\"
     --schema-only --no-owner --no-privileges -n public'` piped through N02b's
     scripts/verify/normalize-pg-dump.mjs. Both sides of every later diff pass through that
     one normalizer; N02a does not write a second one."

  # ---- lib/db/schema.js -----------------------------------------------------
  - "lib/db/schema.js declares the two constraint names production actually carries:
       user_kv:   `(t) => ({ pk: primaryKey({ name: \"user_kv_pkey\", columns: [t.userId, t.key] }) })`
       rvu_codes: the `.references(...)` on tableId (origin/main line 124) moves to a
                  table-level `foreignKey({ columns: [t.tableId], foreignColumns: [rvuTables.id],
                  name: \"rvu_codes_table_id_fkey\" }).onDelete(\"cascade\")`, alongside the
                  existing rvu_codes_table_idx index.
     No column, type, default or nullability changes. Every generated query is unchanged —
     constraint names are metadata drizzle uses only when emitting DDL."

  # ---- scripts/db/migrate.mjs ----------------------------------------------
  - "scripts/db/migrate.mjs
     usage: node scripts/db/migrate.mjs [--url <conn>] [--dir drizzle]
     URL precedence: --url, then DATABASE_URL_UNPOOLED, then POSTGRES_URL_NON_POOLING.
     DATABASE_URL and POSTGRES_URL are NEVER used as a fallback — drizzle.config.js:3-7
     already records why pgBouncer transaction mode breaks session-level DDL, and that
     reasoning must survive into the runner rather than being re-litigated.
     Uses `pg` (node-postgres) over TCP with drizzle-orm/node-postgres/migrator. Importing
     @neondatabase/serverless or drizzle-orm/neon-http here is forbidden and grepped for:
     neon-http cannot open the transaction PgDialect.migrate requires, and N03c must be able
     to point this same file at an ephemeral Neon branch or a postgres:17 container by
     changing a URL and nothing else (N02b's consumes_from_N02a).
     Exit contract, one line to stderr prefixed `MIGRATE:` on each failure:
       0  prints exactly `applied <n> migrations, <m> already present`, both integers read
          back from `select count(*) from drizzle.__drizzle_migrations` before and after
       2  no connection string    `MIGRATE: no unpooled connection string`
       3  the resolved host contains `-pooler.`
          `MIGRATE: refusing pooled host <host> — set DATABASE_URL_UNPOOLED`
       4  drizzle/meta/_journal.json missing or unparseable
       5  the driver raised; the Postgres message is passed through unaltered"
  - "package.json devDependencies gains `pg` (N02b consumes the same runner)."

  # ---- scripts/db/baseline.mjs ---------------------------------------------
  - "scripts/db/baseline.mjs
     usage: node scripts/db/baseline.mjs [--url <conn>] [--dir drizzle] [--dry-run]
     Stamps an existing database as already carrying every journal entry, WITHOUT executing
     one line of their DDL. It creates schema `drizzle` and the `__drizzle_migrations` table
     with the byte-identical DDL from PgDialect.migrate (id SERIAL PRIMARY KEY, hash text NOT
     NULL, created_at bigint), then inserts one row per journal entry with
     hash = sha256(the migration file's entire text) and created_at = that entry's `when`,
     inside one transaction. Same URL precedence and same pooled-host refusal as the runner.
     Exit contract, `BASELINE:` prefix on stderr:
       0  prints `stamped <n> migrations: <tag> <sha8>, ...`
       4  __drizzle_migrations already exists and holds >= 1 row
          `BASELINE: refusing — __drizzle_migrations already has <n> rows`
       5  a journal entry names a .sql file that is absent
       6  public contains ZERO user tables
          `BASELINE: refusing — public is empty; run db:migrate, not db:baseline`
     --dry-run prints the exact rows and writes nothing, not even the schema.
     Exit 6 matters as much as exit 4: stamping an empty database would record migrations
     that never ran and permanently hide the real schema from the runner."

  # ---- scripts/db/table-inventory.mjs --------------------------------------
  - "scripts/db/table-inventory.mjs
     usage: node scripts/db/table-inventory.mjs [--url <conn>] --out <path.json>
     Writes { capturedAt, serverVersion, schemas: { <schema>: { <table>: <exact row count> } },
     migrations: [{ hash, createdAt }] | null } over every non-system schema, using
     `select count(*)` per table, not reltuples. Exit 3 with
     `INVENTORY: found 0 tables` when it finds nothing — an inventory that silently captures
     an empty world would let the before/after comparison pass vacuously
     (INV-CHECKS-ACTUALLY-RUN)."

  # ---- scripts/db/verify-baseline-provenance.mjs ---------------------------
  - "scripts/db/verify-baseline-provenance.mjs
     usage: node scripts/db/verify-baseline-provenance.mjs [--url <conn>] [--self-test]
     Re-runs `drizzle-kit pull` into a temporary directory against the live database,
     applies transforms (a) and (b) from the 0000 contract programmatically, and compares
     the result byte-for-byte with drizzle/0000_baseline.sql.
       0  prints `provenance ok: 0000_baseline.sql == pull(<host>) + documented transforms`
       2  pull failed or produced no SQL file
       3  the bytes differ; prints the unified diff
       4  the re-pull reported fewer than 9 tables, fewer than 5 indexes or 0 foreign keys
          `PROVENANCE: pull returned <n> tables — refusing to compare against nothing`
       5  --self-test: appends one byte to an in-memory copy of the baseline and asserts the
          comparison reports exit 3. A provenance checker that cannot fail proves nothing;
          --self-test exits 0 only when the mutation WAS detected.
     This is what makes 'introspected, not hand-written' a checkable claim instead of a
     promise."

  # ---- scripts/db/known-branches.json --------------------------------------
  - "scripts/db/known-branches.json maps Neon branch id -> { name, endpointHost, role,
     destructiveOk }, with br-late-paper-at5h75si ->
     { name: dev, endpointHost: ep-damp-hill-atuwz5ih.c-9.us-east-1.aws.neon.tech,
       role: dev-schema-only, destructiveOk: true } and
     br-jolly-violet-atsaugx3 -> { name: main, endpointHost: null, role: production,
       destructiveOk: false }.
     It exists because a Neon branch id NEVER appears in a Neon connection string — the host
     carries an endpoint id — so any guard that tries to match a branch id against a URL
     cannot pass. Unknown host means destructiveOk false. Endpoint hostnames are public DNS
     names, not secrets; no credential is committed."

  # ---- package.json / docs --------------------------------------------------
  - "package.json scripts end in exactly this state (N02a is authoritative for these; N02b
     asserts the same end state, so the two nodes agree rather than race):
       \"db:generate\": \"drizzle-kit generate\",
       \"db:migrate\":  \"node --env-file=.env.local scripts/db/migrate.mjs\",
       \"db:baseline\": \"node --env-file=.env.local scripts/db/baseline.mjs\",
       \"db:check\":    \"drizzle-kit check\",
       \"db:studio\" and \"db:seed\" unchanged, and \"db:push\" REMOVED."
  - "README.md:185 and scripts/seed.mjs:2 stop instructing db:push and name db:migrate.
     `grep -rn 'drizzle-kit push\\|db:push' package.json scripts/ app/ lib/ .github/ README.md`
     returns nothing except an explicit 'removed in N02a' note if the Builder writes one."

invariants: [INV-PROD-AUDITED, INV-CHECKS-ACTUALLY-RUN, INV-ALWAYS-SHIPPABLE, INV-NO-DEAD-CODE]

# ─────────────────────────────────────────────────────────────────────────────
verification_environment: >
  The D20 target is the real dev Neon branch br-late-paper-at5h75si — real Neon Postgres
  17.10, schema-only, zero rows, reachable through .env.local (mode 600, gitignored).
  Verified reachable today: unpooled host ep-damp-hill-atuwz5ih.c-9.us-east-1.aws.neon.tech,
  transaction-capable, 18 tables across public and neon_auth.

  NOT a Vercel preview. Preview shares the PRODUCTION DATABASE_URL and Vercel refuses a
  project-level override (DECISIONS.md, "Correction — Vercel will not export integration
  secrets"; N00d's verification_environment_2026_08_18), so a preview-side migration probe
  would migrate production. That substitution is recorded, not silent.

  pg_dump must be 17.x. The host binary is 16.13 and will refuse the server; the already-
  present postgres:17 docker image supplies it with no install.

  PHI: none of this touches user rows. The dev branch holds zero rows and the production
  actions read counts only — no row contents are read, dumped or logged (D25a).

# ─────────────────────────────────────────────────────────────────────────────
# The destructive from-zero replay belongs to N02b, which ships in the SAME pull request.
# N02a does not write a second replay script (D24, INV-NO-DEAD-CODE); it is verified BY that
# script. If N02b is not in the PR, N02a is unverifiable and must not merge.
consumes_from_N02b:
  - "scripts/verify/normalize-pg-dump.mjs — the single normalizer, used to produce
     drizzle/meta/baseline.pg.sql and both sides of every dump diff"
  - "scripts/verify/migration-replay.mjs --allow-drop-public — the guarded from-zero replay"

cross_node_conflicts:
  - id: replay-guard-branch-match
    with: N02b-migration-ci-check
    finding: >
      N02b's exit-13 rule requires "--dev-branch-id's value occurs verbatim in --url (a
      substring match on the Neon branch id)". Measured: the dev branch's connection host is
      ep-damp-hill-atuwz5ih.c-9.us-east-1.aws.neon.tech. A Neon connection string contains
      an ENDPOINT id and never the branch id, so that guard can never be satisfied and
      N02b's own "same guard against the real dev Neon branch" command would exit 13.
    resolution: >
      N02a ships scripts/db/known-branches.json. N02b's guard resolves --dev-branch-id
      through that map and compares the mapped endpointHost to the URL host, refusing on any
      host absent from the map. Default-deny is preserved and the check becomes passable.
      Both nodes are in one PR; whichever Builder gets there first makes the edit.
  - id: package-json-schema-scripts
    with: N02b-migration-ci-check
    finding: Both nodes contract the db:* script block and the removal of db:push.
    resolution: Identical end state, listed above. N02a is authoritative; no divergence exists.

# ─────────────────────────────────────────────────────────────────────────────
verify:
  runtime:
    # 1. the baseline really is introspected, and the checker can fail
    - "node --env-file=.env.local scripts/db/verify-baseline-provenance.mjs
       # expect exit 0, 'provenance ok: 0000_baseline.sql == pull(ep-damp-hill-...) + documented transforms'"
    - "node --env-file=.env.local scripts/db/verify-baseline-provenance.mjs --self-test
       # mutates a copy and asserts detection; exit 0 ONLY if the mutation was caught"

    # 2. schema.js, drizzle/ and the live database agree
    - "node --env-file=.env.local ./node_modules/.bin/drizzle-kit check < /dev/null
       # expect \"Everything's fine\", exit 0"
    - "node --env-file=.env.local timeout 120 ./node_modules/.bin/drizzle-kit generate --name should-not-exist < /dev/null
       # expect 'No schema changes, nothing to migrate', exit 0"
    - "git add --intent-to-add -A drizzle/ && git diff --exit-code drizzle/
       # --intent-to-add is load-bearing: a drift migration is UNTRACKED and git diff alone exits 0 on it"

    # 3. from an empty public schema on the REAL dev Neon branch, the history rebuilds production
    - "node scripts/verify/migration-replay.mjs
         --url \"$DATABASE_URL_UNPOOLED\" --dir drizzle
         --expect drizzle/meta/baseline.pg.sql
         --allow-drop-public --dev-branch-id br-late-paper-at5h75si
         --dump-out goals/evidence/N02a-baseline-migration/replay-dump.sql
         --report goals/evidence/N02a-baseline-migration/replay-report.json
       # expect exit 0 and exactly 'applied 2 migrations'; report.match === true"
    - "node scripts/verify/migration-replay.mjs --url \"$DATABASE_URL_UNPOOLED\" --dir drizzle --expect drizzle/meta/baseline.pg.sql --dev-branch-id br-late-paper-at5h75si; test $? -eq 13
       # without --allow-drop-public the guard must refuse to touch anything"
    - "node scripts/verify/migration-replay.mjs --url \"$DATABASE_URL_UNPOOLED\" --dir drizzle --expect drizzle/meta/baseline.pg.sql --allow-drop-public --dev-branch-id br-does-not-exist; test $? -eq 13
       # wrong branch id must refuse even with the destructive flag"

    # 4. the runner's own guards, against the real branch
    - "node scripts/db/migrate.mjs --url \"$DATABASE_URL\"; test $? -eq 3
       # the POOLED url (…-pooler.…) must be refused, not silently used"
    - "env -u DATABASE_URL_UNPOOLED -u POSTGRES_URL_NON_POOLING node scripts/db/migrate.mjs; test $? -eq 2"
    - "node --env-file=.env.local scripts/db/migrate.mjs
       # immediately after the replay: expect 'applied 0 migrations, 2 already present', exit 0"

    # 5. the stamp, exercised on the dev branch before it is ever pointed at production
    - "node --env-file=.env.local scripts/db/table-inventory.mjs --out goals/evidence/N02a-baseline-migration/dev-inventory-before.json"
    - "node --env-file=.env.local scripts/db/baseline.mjs --dry-run
       # prints the two rows, writes nothing"
    - "node --env-file=.env.local psql-free-drop-migrations.mjs || true   # see notes: the dev branch is re-stamped from scratch
       node --env-file=.env.local scripts/db/baseline.mjs
       # expect exit 0, 'stamped 2 migrations: 0000_baseline <sha8>, 0001_llm_usage b9d4757d'"
    - "node --env-file=.env.local scripts/db/baseline.mjs; test $? -eq 4
       # second run must refuse: __drizzle_migrations is no longer empty"
    - "node --env-file=.env.local scripts/db/migrate.mjs
       # THE stamp proof: a correct stamp makes the runner a no-op — 'applied 0 migrations, 2 already present'"
    - "node --env-file=.env.local scripts/db/table-inventory.mjs --out goals/evidence/N02a-baseline-migration/dev-inventory-after.json
       && node -e \"const a=require('./goals/evidence/N02a-baseline-migration/dev-inventory-before.json'),b=require('./goals/evidence/N02a-baseline-migration/dev-inventory-after.json');const k=o=>Object.keys(o.schemas.public).sort().join(',');if(k(a)!==k(b))process.exit(1)\"
       # the public table set is unchanged by the stamp"

    # 6. the app still ships
    - "node --env-file=.env.local ./node_modules/.bin/next build"
    - "npm run test:redaction && npm run test:forged-attachment && npm run test:llm-proxy-contract && npm run test:error-envelope && npm run test:route-contracts && npm run lint"

  static:
    - "! grep -rn 'drizzle-kit push' package.json scripts/ .github/ README.md"
    - "! node -e \"process.exit(require('./package.json').scripts['db:push']?0:1)\""
    - "test -f drizzle/meta/_journal.json && test -f drizzle/meta/0000_snapshot.json && test -f drizzle/meta/0001_snapshot.json"
    - "! test -f drizzle/schema.ts && ! test -f drizzle/relations.ts"

rollback: >
  Revert the commit. Repo-only: no deploy, no migration, no data, no production action, so
  INV-PROD-AUDITED needs no log entry beyond the merge itself. The one irreversible-feeling
  piece is the registry rewrite (pnpm -> npm across INVARIANTS.yaml and node YAMLs); it is a
  text change in git and reverts with the rest.

  If `.money-allowlist` proves unmaintainable — churning red on unrelated edits despite the
  sha12 identity scheme — the fallback is to demote `lint:money` to a report-only step that
  still uploads money-report.json but does not gate the job. That demotion is a recorded
  entry in DECISIONS.md naming the date, the reason and the node that restores the gate. It is
  NEVER a quiet `continue-on-error:` in the workflow, and never a deleted step. A gate that
  disappears without a decision is how a registry becomes slogans again.


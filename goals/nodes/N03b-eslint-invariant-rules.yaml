     the Validator re-derives the denominator itself with
     `grep -cE '^[[:space:]]+cmd:' goals/INVARIANTS.yaml` (33 on origin/main at 2026-08-18;
     POSIX class, not \\s, so it is portable between the BSD grep on the operator's Mac and the
     GNU grep in CI) and asserts it equals the number of
     registry-sourced entries in the report — with `totals.vacuous == 0` and every non-RUNNABLE
     entry carrying a non-null `blocked_by`. The Validator reads the artifact. A summary line
     saying 'all checks pass' is not evidence and is not accepted."

  - "2. `--self-test` exits 0 on the shipped classifier and exits non-zero on the V8-neutered
     classifier (poison run 4). Both transcripts are in evidence. This is the entry that
     matters most: a classifier incapable of returning non-zero is precisely the failure
     INV-CHECKS-ACTUALLY-RUN was written about, and 'the self-test passed' proves nothing
     unless the self-test has been shown to fail on demand."


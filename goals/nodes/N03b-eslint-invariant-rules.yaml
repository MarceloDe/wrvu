notes: >
  MONEY BASELINE, measured not guessed. AST scan of every committed .js/.jsx/.mjs/.ts/.tsx on
  origin/main at 2026-08-18, using the whole-token identifier rule contracted above.
  Seventeen violations, all in components/NeuroRVU.jsx, at lines:
    368, 379 (x2: the `*` and the `/` of `Math.round(b.wrvu * 10) / 10`),
    618 (x2), 626, 665, 1212, 1213, 1214, 1388, 1658, 1670 (x2), 1732, 1740, 1782.
  1212-1214 are the extra-duty PPC computation (`exCounts.mri * Number(extraRates.ppcMri)`),
  caught through the `extraRates` object name — these are the same lines G10.10 says must move
  server-side, so N05/N14 will remove them for an independent reason. No violation exists
  outside that one file: lib/, app/ and scripts/ are clean, and the only hits in the four .ts
  files are inside comments. The line numbers WILL drift; the sha12 identity is what the
  allowlist keys on, and `--update-lines` refreshes the informational comment.

  ALLOWLIST OWNERSHIP. Removal is not this node's job and must not be attempted here (D38:
  improve, never rebuild; D33: leave the app shippable). The owners are
  N06-decompose-dashboard (which splits the 1833-line component, at which point the entries
  move file with their sha12 intact) and N14-pricing-engine (which creates
  packages/core/pricing and deletes them). Every allowlist line carries `# owner: N06` or
  `# owner: N14` in its comment so the ratchet has a visible end state.

  WHY npm AND NOT pnpm. The alternative — adopt pnpm to match the registry — was considered
  and rejected here, though not forever. Against it: package-lock.json is committed and is
  what Vercel builds both projects from; swapping the lockfile of a repo with three live
  deployables is an INV-ALWAYS-SHIPPABLE risk taken for a cosmetic gain; and the fail-loud
  property that motivated `--fail-if-no-match` is empirically preserved by
  `npm run --workspace` (verified: exit 1, npm 12.0.2). For it: D19's monorepo may prefer pnpm
  workspaces. That is N01's decision to make, on N01's evidence. What this node forbids is the
  status quo — a registry naming a package manager the repo does not use, which is a
  vacuous-check generator by construction. If N01 chooses pnpm, it flips `packageManager` and
  re-runs checks-are-executable, which will then classify every `npm run` cmd as V1 and force
  the same rewrite in the other direction. That is the mechanism working, not a regression.

  THE TYPECHECK CLAUSE OF G10.7 IS N03a's, NOT THIS NODE'S. `npm run typecheck` does not exist
  on origin/main and no invariant references it, so checks-are-executable will not see it and
  will not classify it. If N03a adds a `typecheck` step, this node's classifier covers it the
  moment any invariant or node YAML names it. Recorded so the seam is deliberate and nobody
  later reads its absence as an oversight.

  WHAT THIS NODE DOES NOT DO. It does not write the eleven missing scripts/verify/*.mjs
  implementations (phi-schema-scan, clerk-callsite-scan, descriptor-separable, flag-hygiene,
  contract-compat, no-est-flag, source-terms, rls-enabled, prod-audit-log, dead-code,
  parity-report). After this node they are all classified VACUOUS-or-DECLARED-BLOCKED and the
  registry says so out loud in a committed artifact. Making the registry honest about being
  incomplete is the deliverable; making it complete is eleven other nodes. The Builder must
  therefore expect that landing this node REQUIRES adding `blocked_external` stanzas to
  several existing node YAMLs, or the classifier will correctly exit 1 on its own branch —
  and that work is in scope, because a classifier that cannot go green is not landable.

id: N02b-migration-ci-check
title: CI fails when lib/db/schema.js, drizzle/ and a from-zero replay disagree
goal_refs: [G10, G10.6, G10.7]
decisions: [D20, D24, D38]
depends_on: [N03a-github-actions-base, N02a-baseline-migration]
phase: A1
estimate_hours: 6
priority: 2
severity: silent-decay

rationale: >
  Nothing in this repository can currently detect that the schema and the database have
  drifted apart, because there is nothing to drift against.

  drizzle.config.js:30 declares `out: "./drizzle"`. That directory does not exist —
  `ls drizzle` returns "No such file or directory". drizzle.config.js:8-12 resolves a
  connection string and lines 14-19 throw without one, so the config is well formed; it
  simply has never emitted a migration.

  package.json:10 exposes exactly one schema command: `"db:push": "drizzle-kit push"`.
  There is no db:generate, no db:migrate, no db:check. `drizzle-kit push` diffs
  lib/db/schema.js (134 lines, 15 tables) straight into the live database and writes no
  file. Every schema change this project has ever made went that way, which is why the
  production schema exists only inside Neon and nowhere in git.

  There is no .github directory at all, so no check of any kind runs on a pull request.
  scripts/ contains one file, seed.mjs.

  N02a captures the current production schema as migration 0000 and writes
  drizzle/meta/baseline.pg.sql. That is a snapshot, and a snapshot decays the first time
  somebody types `npm run db:push` out of habit — which is the only schema command the
  package currently offers, and therefore the habit that exists. This node is the check
  that converts G10.6's "single schema source" from a sentence in a node YAML into a
  property the repository enforces on every pull request.

split_recommended:
  recommended: true
  seam: >
    Between the AGREEMENT checks and the HISTORY check.

    N02b-1 (agreement): the replay guard, the vacuity assertions, `drizzle-kit check`, and
    `drizzle-kit generate` + `git diff --exit-code drizzle/`. Contract: "the schema, the
    migration directory and a from-zero replay all describe the same database."

    N02b-2 (history): scripts/verify/migration-immutable.mjs. Contract: "a migration that
    already ran somewhere is never edited again."

    These are genuinely two contracts, and poison 2 below proves it rather than asserting
    it: appending a SQL comment to an applied migration leaves the schema, the migration
    directory and the replay in PERFECT agreement, so every agreement check stays green
    while the file's bytes have changed underneath every database that already ran it.
    A check that catches something no other check can catch is not the same contract.

    They are contracted here as one node anyway because they share one CI job, one PR
    (BACKLOG `couples:` puts both in N02a's PR) and one evidence bundle, and because
    N02b-2 is roughly forty minutes of work — splitting it produces a node whose
    orchestration cost exceeds its content. If the orchestrator prefers the split, cut at
    the seam above; nothing else in this file changes.

context_query: >
  codegraph explore "drizzle.config.js migrationUrl DATABASE_URL_UNPOOLED lib/db/schema.js
  pgTable exports lib/db/index.js db client seed.mjs — how is the Drizzle schema defined and
  how does anything connect to Postgres today"

# ─────────────────────────────────────────────────────────────────────────────
# The interface this node consumes from N02a. Same PR, so ordering inside the PR
# is a Builder concern, but the SHAPE is fixed here because N02b's guard calls it.
consumes_from_N02a:
  - "drizzle/*.sql — at least one migration file, numbered, drizzle-kit generated"
  - "drizzle/meta/_journal.json — { version, dialect, entries: [{ idx, version, when, tag, breakpoints }] }, entries.length >= 1"
  - "drizzle/meta/baseline.pg.sql — the NORMALIZED pg_dump of the real dev Neon branch
     (br-late-paper-at5h75si, Postgres 17.10), produced by THIS node's
     scripts/verify/normalize-pg-dump.mjs so both sides of the CI diff normalize identically.
     This shared normalizer is the reason the two nodes are one pull request."
  - "scripts/db/migrate.mjs — applies every journal entry in order against
     process.env.DATABASE_URL_UNPOOLED and creates drizzle.__drizzle_migrations.
     It MUST use `pg` (node-postgres) over TCP, NOT @neondatabase/serverless.
     lib/db/index.js:5 imports { neon } from @neondatabase/serverless, which speaks Neon's
     HTTP protocol and cannot connect to a plain Postgres container at all. `pg` reaches
     both the container and Neon, so N03c's swap to an ephemeral Neon branch is a URL
     change and not a code change."
  - "package.json devDependencies gains `pg`"

# ─────────────────────────────────────────────────────────────────────────────
substitution_declared_not_glossed: >
  The replay runs against a `postgres:17` service container, not Neon. Stated here rather
  than buried, because it is a deviation from D20.

  What is true as of 2026-08-18: a real dev Neon branch DOES now exist
  (state.json dev_database — br-late-paper-at5h75si, Postgres 17.10, schema-only, zero
  rows). It is reachable from the OPERATOR'S machine via .env.local, which is mode 600 and
  gitignored. It is not reachable from CI: no NEON_API_KEY secret exists, and `vercel env
  pull` writes the literal string [SENSITIVE] in place of every integration secret on CLI
  54.14.2 and 59.1.4 (DECISIONS.md, "Correction — Vercel will not export integration
  secrets", 2026-08-18), so there is no route to a connection string from the platform.

  Even if that one URL were pasted into a GitHub secret, it would still be the wrong
  instrument. This job's contract requires an EMPTY database, per run, ephemeral. The dev
  branch is a single shared branch with 15 tables in it. Two concurrent pull requests
  replaying from zero into it would race, and each would have to drop the public schema
  first. A shared mutable database is not an ephemeral one.

  A postgres:17 container is real Postgres, over a real socket, executing the real DDL —
  so D20's prohibition on mocks is respected. It is NOT Neon. The Neon behaviours it cannot
  exercise are the pgBouncer pooler, the neon-http driver, and Neon's extension defaults.
  The baseline DDL depends on none of the three, and that claim is not taken on trust: the
  SAME guard script is required below to pass against the real dev Neon branch
  (verify.runtime, the --allow-drop-public command), so the container and Neon are shown to
  agree rather than assumed to.

  N03c-neon-branch-runner replaces the container with an ephemeral Neon branch per run.
  done_when #7 pins the string `image: postgres:17` to one line of the migrations job
  precisely so N03c can be verified later to have removed it. The substitution cannot
  become permanent by neglect.

# ─────────────────────────────────────────────────────────────────────────────
contracts:

  # ---- scripts/verify/normalize-pg-dump.mjs ---------------------------------
  - "scripts/verify/normalize-pg-dump.mjs
     usage: node scripts/verify/normalize-pg-dump.mjs [--in <path>] [--out <path>]  (default stdin/stdout)
     exit 0 on success, exit 2 on unreadable input.
     Deterministic transform, documented in the file header, applied in this order:
       (a) drop every line matching /^--/ (kills the `-- Dumped by pg_dump version` header)
       (b) drop `\\restrict` / `\\unrestrict` psql meta-commands, which pg_dump 17.6+ emits
       (c) drop `SET ` lines and `SELECT pg_catalog.set_config(...)` preamble lines
       (d) split the remainder into statements on `;` at end of line, trim each, drop empties
       (e) sort the statements lexicographically and join with '\\n'
     (e) is required, not cosmetic: pg_dump orders some object classes by OID, so two dumps
     of an identical schema are not guaranteed byte-identical without it."

  # ---- scripts/verify/migration-replay.mjs ----------------------------------
  - "scripts/verify/migration-replay.mjs
     usage: node scripts/verify/migration-replay.mjs --url <pg-conn-string> [--dir drizzle]
            [--expect drizzle/meta/baseline.pg.sql] [--dump-out <path>] [--report <path>]
            [--allow-drop-public --dev-branch-id <id>]
     Executes, in this order, halting at the first failure, each failure printing ONE line
     to stderr beginning `MIGRATION-GUARD: ` and exiting with the code shown:
       10  <dir> is absent or contains zero *.sql files
           `MIGRATION-GUARD: drizzle/ contains 0 .sql migration files`
       11  <dir>/meta/_journal.json is absent, unparseable, or entries.length === 0
           `MIGRATION-GUARD: drizzle/meta/_journal.json missing or empty`
       12  journal entries and on-disk *.sql files disagree (a tag with no file, or a file
           with no entry) — names the offending tag or filename
       13  the target database's `public` schema already contains user tables, unless
           --allow-drop-public was passed AND --dev-branch-id's value occurs verbatim in
           --url (a substring match on the Neon branch id). Without both, the script never
           issues DROP SCHEMA — it refuses.
       14  the replay applied zero migrations
           `MIGRATION-GUARD: applied 0 migrations`
       15  the normalized replay dump differs from the normalized --expect file; the
           unified diff is printed to stdout in full
       16  `pg_dump` is unavailable, or its major version is not 17
       17  scripts/db/migrate.mjs is absent or exits non-zero (its stderr is passed through)
     On success it prints exactly one line matching /^applied [0-9]+ migrations$/ and exits 0.
     The count is NOT self-reported: it is `SELECT count(*) FROM drizzle.__drizzle_migrations`
     read back from the database after `node scripts/db/migrate.mjs` returns, and the script
     also asserts that count === journal entries.length or exits 12."

  - "migration-replay.mjs --report writes JSON:
     { applied: number, journalEntries: number, files: string[], pgServerVersion: string,
       pgDumpVersion: string, dumpSha256: string, expectSha256: string, match: boolean }
     `applied` in this file must equal the integer in the `applied N migrations` stdout line."

  - "migration-replay.mjs invokes N02a's runner rather than reimplementing it:
     `node scripts/db/migrate.mjs` with DATABASE_URL_UNPOOLED set to --url. There is exactly
     one migration runner in the repository; this node verifies it, it does not duplicate it."

  # ---- scripts/verify/migration-immutable.mjs -------------------------------
  - "scripts/verify/migration-immutable.mjs
     usage: node scripts/verify/migration-immutable.mjs --base <git-ref> [--dir drizzle]
     Compares `git hash-object` of the working tree against the blob shas at <base> for
     every `<dir>/*.sql` and `<dir>/meta/*_snapshot.json` path that exists at <base>.
       exit 2  <base> does not resolve (`git rev-parse --verify <base>` fails)
               `MIGRATION-GUARD: base ref <ref> unresolvable`
               A missing base is a HARD FAILURE, never a skip — a shallow checkout must turn
               this job red, not green (INV-CHECKS-ACTUALLY-RUN).
       exit 3  a path present at <base> has different bytes at HEAD, or was deleted
               `MIGRATION-IMMUTABLE: modified <path> (base <sha8> -> head <sha8>)`
               `MIGRATION-IMMUTABLE: deleted <path>`
       exit 4  _journal.json entries present at <base> were removed, reordered, or had their
               `tag` or `when` changed. Appending new entries at the end is the only legal edit.
       exit 5  <base> has zero migrations AND HEAD has zero migrations — the check matched
               nothing and must not report success (INV-CHECKS-ACTUALLY-RUN).
     exit 0 prints `MIGRATION-IMMUTABLE: <N> migrations unchanged, <M> added`.
     Adding files is always legal. N === 0 with M > 0 is legal and is what this node's own
     pull request produces, since origin/main carries no drizzle/ directory today."

  # ---- the CI job -----------------------------------------------------------
  - "`.github/workflows/ci.yml` gains ONE job, keyed `migrations`, appended to the file
     N03a created. runs-on: ubuntu-latest.
     services.postgres.image is the literal `postgres:17`, with
       env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: radrvu_ci }
       ports: ['5432:5432']
       options: --health-cmd \"pg_isready -U postgres\" --health-interval 5s --health-retries 20
     job-level env sets both MIGRATION_DB_URL and DATABASE_URL_UNPOOLED to the literal
     `postgres://postgres:postgres@127.0.0.1:5432/radrvu_ci`."

  - "The `migrations` job references no `secrets.` value of any kind. It must be structurally
     incapable of pointing the replay — which drops and recreates a schema — at a real
     database. This is asserted statically below."

  - "Steps, in this exact order, with these exact `name:` values, because the poison runs
     below are identified by which step failed:
       1. `checkout`                      actions/checkout@v4 with fetch-depth: 0
       2. `fetch base branch`             git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
       3. `setup node`                    actions/setup-node@v4, node-version 20, cache npm
       4. `install`                       npm ci
       5. `replay migrations from zero`   node scripts/verify/migration-replay.mjs --url \"$MIGRATION_DB_URL\"
                                            --dir drizzle --expect drizzle/meta/baseline.pg.sql
                                            --dump-out replay-dump.sql --report migration-replay.json
       6. `drizzle-kit check`             npx --no-install drizzle-kit check < /dev/null
       7. `drizzle-kit generate`          timeout 120 npx --no-install drizzle-kit generate < /dev/null
       8. `no uncommitted migration drift`  git add --intent-to-add -A drizzle/ && git diff --exit-code drizzle/
       9. `applied migrations are immutable` node scripts/verify/migration-immutable.mjs --base origin/main
      10. `upload evidence`               actions/upload-artifact@v4, if: always(),
                                            paths replay-dump.sql, migration-replay.json
     No step carries continue-on-error. Step 10's `if: always()` is the only conditional."

  - "Step 8 runs `git add --intent-to-add -A drizzle/` BEFORE `git diff --exit-code drizzle/`,
     and the reason is load-bearing rather than stylistic. On drift, `drizzle-kit generate`
     writes a NEW file (drizzle/000N_<word>.sql) plus a NEW meta snapshot. Both are UNTRACKED.
     `git diff --exit-code` does not see untracked files and exits 0. Without --intent-to-add
     this step is a vacuous check that passes on exactly the drift it exists to catch, which
     is the failure mode INV-CHECKS-ACTUALLY-RUN names."

  - "Steps 6 and 7 run with stdin closed (`< /dev/null`) and step 7 under `timeout 120`.
     drizzle-kit 0.28.1 prompts interactively when it suspects a rename; on a CI runner an
     unanswered prompt hangs the job for the full six hours. Closed stdin plus a timeout turns
     a prompt into a fast red instead of a hang."

  - "package.json gains: `db:generate`: `drizzle-kit generate`, `db:migrate`:
     `node --env-file=.env.local scripts/db/migrate.mjs`, `db:check`: `drizzle-kit check`.
     `db:push` (package.json:10) is REMOVED. It is the only schema command the package offers
     today and therefore the only habit that exists; leaving it in place while adding a CI job
     to detect its effects is contradictory."

invariants: [INV-CHECKS-ACTUALLY-RUN, INV-ALWAYS-SHIPPABLE, INV-NO-DEAD-CODE]

verification_environment: >
  Three surfaces, all real Postgres.
  (a) GitHub Actions on MarceloDe/wrvu, ubuntu-latest, `postgres:17` service container.
      This is the authoritative evidence: five run ids.
  (b) The operator's machine, a local postgres:17 container, for the Builder's edit loop so
      that iterating does not cost a pull request each time.
  (c) The real dev Neon branch br-late-paper-at5h75si (Postgres 17.10, schema-only, zero
      rows, no production data — D25a satisfied), reached through DATABASE_URL_UNPOOLED in
      .env.local. Used ONCE, to demonstrate that the guard's verdict is the same on Neon as
      in the container. Requires --allow-drop-public and the branch id, and the script
      refuses to drop anything without both.
  No Vercel preview is involved: Preview shares the PRODUCTION DATABASE_URL.

verify:
  runtime:
    # --- local loop, real Postgres, before spending pull requests ------------
    - "docker run -d --name radrvu-ci-pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres -e POSTGRES_DB=radrvu_ci -p 55432:5432 postgres:17"
    - "node scripts/verify/migration-replay.mjs --url postgres://postgres:postgres@127.0.0.1:55432/radrvu_ci --dir drizzle --expect drizzle/meta/baseline.pg.sql --dump-out /tmp/replay-dump.sql --report goals/evidence/N02b-migration-ci-check/migration-replay.json   # expect: 'applied N migrations', N>0, exit 0"
    - "node scripts/verify/migration-immutable.mjs --base does-not-exist-ref; test $? -eq 2   # a missing base is red, not green"
    - "node scripts/verify/migration-immutable.mjs --base origin/main   # exit 0, '0 migrations unchanged, N added'"
    # --- the same guard against the REAL dev Neon branch (D20) ---------------
    - "node --env-file=.env.local scripts/verify/migration-replay.mjs --url \"$DATABASE_URL_UNPOOLED\" --allow-drop-public --dev-branch-id br-late-paper-at5h75si --dir drizzle --expect drizzle/meta/baseline.pg.sql --dump-out goals/evidence/N02b-migration-ci-check/neon-replay-dump.sql   # container and Neon must return the same verdict"
    - "node scripts/verify/migration-replay.mjs --url \"$DATABASE_URL_UNPOOLED\" --allow-drop-public --dev-branch-id br-WRONG-id; test $? -eq 13   # the drop guard refuses on a branch-id mismatch"
    # --- drizzle-kit check is exercised, not decorative ----------------------
    - "cp drizzle/meta/0000_snapshot.json /tmp/snap.bak && printf '{' > drizzle/meta/0000_snapshot.json && (npx --no-install drizzle-kit check < /dev/null; echo \"exit=$?\") | tee goals/evidence/N02b-migration-ci-check/drizzle-kit-check-poison.txt; cp /tmp/snap.bak drizzle/meta/0000_snapshot.json   # exit must be non-zero"
    # --- the authoritative evidence: five real GitHub Actions runs -----------
    - "gh pr checks <n02a-pr> --watch                      # the node's own PR, migrations job green"
    - "gh run view <green-id> --log | grep -E '^.*applied [1-9][0-9]* migrations'"
    - "gh run view <green-id> --json databaseId,conclusion,headSha,htmlUrl,jobs > goals/evidence/N02b-migration-ci-check/migrations-green-run.json"
    - "gh pr create --head poison/N02b-1-schema-drift        --title 'POISON 1 do not merge' --body 'adds a column to lib/db/schema.js with no migration'"
    - "gh run view <poison1-id> --log | grep -E '^diff --git a/drizzle/'   # caught by step 8"
    - "gh run view <poison1-id> --json databaseId,conclusion,jobs > goals/evidence/N02b-migration-ci-check/poison-drift-run.json"
    - "gh pr create --head poison/N02b-3-delete-journal      --title 'POISON 3 do not merge' --body 'deletes drizzle/meta/_journal.json'"
    - "gh run view <poison3-id> --log | grep -F 'MIGRATION-GUARD: drizzle/meta/_journal.json missing or empty'"
    - "gh run view <poison3-id> --json databaseId,conclusion,jobs > goals/evidence/N02b-migration-ci-check/poison-journal-run.json"
    - "gh pr create --head poison/N02b-4-empty-drizzle       --title 'POISON 4 do not merge' --body 'git rm -r drizzle/*.sql'"
    - "gh run view <poison4-id> --log | grep -F 'MIGRATION-GUARD: drizzle/ contains 0 .sql migration files'"
    - "gh run view <poison4-id> --json databaseId,conclusion,jobs > goals/evidence/N02b-migration-ci-check/poison-empty-run.json"
    # POISON 2 runs ONLY after the N02a+N02b PR is merged — see notes.poison_2_sequencing
    - "gh pr create --head poison/N02b-2-edit-applied-migration --title 'POISON 2 do not merge' --body 'appends a SQL comment to an already-merged migration; schema-identical, bytes changed'"
    - "gh run view <poison2-id> --log | grep -E 'MIGRATION-IMMUTABLE: modified drizzle/[0-9]{4}_.*\\.sql'"
    - "gh run view <poison2-id> --json databaseId,conclusion,jobs > goals/evidence/N02b-migration-ci-check/poison-immutable-run.json"
    - "for b in 1 2 3 4; do gh pr close poison/N02b-$b-* --delete-branch; done   # poison branches are closed, never merged"
    - "docker rm -f radrvu-ci-pg"

  static:
    - "grep -q 'image: postgres:17' .github/workflows/ci.yml"
    - "test $(grep -c 'image: postgres:17' .github/workflows/ci.yml) -eq 1"
    - "! grep -n 'continue-on-error' .github/workflows/ci.yml"
    - "! grep -n '|| true' .github/workflows/ci.yml"
    - "grep -q 'fetch-depth: 0' .github/workflows/ci.yml"
    - "grep -q 'git add --intent-to-add -A drizzle/' .github/workflows/ci.yml"
    - "grep -q 'migration-immutable.mjs --base origin/main' .github/workflows/ci.yml"
    - "! awk '/^  migrations:/{f=1;next} f&&/^  [A-Za-z]/{f=0} f' .github/workflows/ci.yml | grep -q 'secrets\\.'"
    - "! grep -q '\"db:push\"' package.json"
    - "grep -q '\"db:migrate\"' package.json && grep -q '\"db:generate\"' package.json && grep -q '\"db:check\"' package.json"
    - "test -f scripts/verify/migration-replay.mjs && test -f scripts/verify/migration-immutable.mjs && test -f scripts/verify/normalize-pg-dump.mjs"
    - "! grep -q '@neondatabase/serverless' scripts/db/migrate.mjs   # the runner must speak plain TCP"

  manual: []

  evidence:
    - run-ids.md                        # the five ids, the PR each came from, and which step failed
    - migrations-green-run.json
    - poison-drift-run.json             # poison 1
    - poison-immutable-run.json         # poison 2
    - poison-journal-run.json           # poison 3
    - poison-empty-run.json             # poison 4 — ADDED to the backlog's list; done_when #1 names five runs and the backlog named four artifacts
    - replay-dump-diff.txt              # the step-5 diff output from a deliberately mismatched --expect, proving exit 15 is reachable
    - migration-replay.json             # the --report file from the green run
    - neon-replay-dump.sql              # the same guard, run against the real dev Neon branch
    - drizzle-kit-check-poison.txt      # drizzle-kit check exits non-zero on a corrupt snapshot

done_when:
  - "goals/evidence/N02b-migration-ci-check/run-ids.md names exactly five GitHub Actions run
     ids on MarceloDe/wrvu. `gh run view <id> --json conclusion --jq .conclusion` returns
     `success` for exactly one and `failure` for the other four. No id is a re-run of another."

  - "For the success id, `gh run view <id> --log | grep -oE 'applied [0-9]+ migrations'` yields
     a count > 0, and that integer equals BOTH `jq .applied migration-replay.json` AND
     `jq '.entries | length' drizzle/meta/_journal.json`. Three independently produced numbers
     agree; a Builder cannot fake the third, since the journal is N02a's committed artifact."

  - "For poison 4's id the conclusion is `failure` and the log contains
     `MIGRATION-GUARD: drizzle/ contains 0 .sql migration files`. A run that applies zero
     migrations is red. This is the INV-CHECKS-ACTUALLY-RUN case stated as an executed fact."

  - "For poison 3's id the conclusion is `failure`, the failing step is `replay migrations from
     zero`, and the log contains `MIGRATION-GUARD: drizzle/meta/_journal.json missing or empty`.
     Deleting the journal is a failure, not a skip."

  - "For poison 1's id the conclusion is `failure`, the failing step is
     `no uncommitted migration drift`, the log contains a line starting `diff --git a/drizzle/`,
     and every step numbered lower concluded `success`. `git diff --exit-code drizzle/` is
     demonstrably the catcher, not a bystander."

  - "For poison 2's id the conclusion is `failure`, the failing step is
     `applied migrations are immutable`, the log matches
     `MIGRATION-IMMUTABLE: modified drizzle/[0-9]{4}_.*\\.sql`, and steps 5 through 8 ALL
     concluded `success`. The agreement checks stayed green while a byte changed under an
     already-applied migration — which is the whole argument for the immutability check
     existing, and for the split recommended above."

  - "`grep -c 'image: postgres:17' .github/workflows/ci.yml` returns exactly 1, inside the
     `migrations` job. N03c-neon-branch-runner is later verified by this count returning 0."

  - "`node scripts/verify/migration-immutable.mjs --base does-not-exist-ref` exits 2 and prints
     `unresolvable`. The check cannot pass by failing to find its own baseline."

  - "drizzle-kit-check-poison.txt shows a non-zero exit from `npx drizzle-kit check` against a
     corrupted drizzle/meta/0000_snapshot.json, and `git status --porcelain drizzle/` is empty
     afterwards, proving the snapshot was restored."

  - "`awk '/^  migrations:/{f=1;next} f&&/^  [A-Za-z]/{f=0} f' .github/workflows/ci.yml |
     grep -c 'secrets\\.'` returns 0. The job that drops and recreates a public schema has no
     access to any credential, so it cannot be aimed at a real database by editing one line."

  - "All five run logs are still retrievable by `gh run view <id> --log` at validation time.
     If GitHub has expired them, the node reverts to `fail` — the evidence is the run, not the
     Builder's transcript of it."

rollback: >
  Delete the `migrations` job from .github/workflows/ci.yml, delete
  scripts/verify/migration-replay.mjs, scripts/verify/migration-immutable.mjs and
  scripts/verify/normalize-pg-dump.mjs, and drop `pg` from devDependencies.
  drizzle/, drizzle/meta/baseline.pg.sql and scripts/db/migrate.mjs belong to N02a and stay.
  Restore `"db:push": "drizzle-kit push"` to package.json only if the operator explicitly
  wants the old habit back.

  There is no production, deployment or data impact to undo. The job runs only against an
  ephemeral container that is destroyed with the runner, it references no secret (asserted
  statically and in done_when), it never touches Vercel, and the only non-container database
  it ever contacts is the zero-row dev Neon branch, once, from the operator's own machine
  behind two explicit flags. The four poison pull requests are closed with --delete-branch and
  never merged; if one were merged by accident, revert the merge commit — each poison changes
  exactly one file.

notes:
  poison_2_sequencing: >
    Poison 2 cannot run before the N02a+N02b pull request is merged, and pretending otherwise
    would be the easiest hole in this node to miss.

    migration-immutable.mjs compares HEAD against origin/main. origin/main carries no drizzle/
    directory today (verified: `ls drizzle` -> No such file or directory), so on the node's own
    PR the base has zero migrations and the head has N — which is the legal "0 unchanged, N
    added" case, exit 0. There is nothing on main to make immutable yet.

    Therefore: poisons 1, 3 and 4 run against the open N02a+N02b PR. Poison 2 runs afterwards,
    branched from the merged main, and edits whichever drizzle/*.sql file main actually carries.
    run-ids.md must record that filename as observed, not as predicted — the backlog guessed
    `drizzle/0001_llm_usage.sql`, but N00c's llm_usage table merged in phase A0 and will
    therefore already be inside N02a's 0000 baseline, so that file will most likely not exist.

  why_poison_2_is_a_comment_and_not_a_ddl_change: >
    Poison 2 appends the single line `-- touched` to the migration file. Nothing else.

    A DDL change would be caught earlier, at step 5, when the replayed schema stopped matching
    baseline.pg.sql — and the run would then prove nothing about the immutability check. A
    comment leaves the replayed schema byte-identical, leaves `drizzle-kit check` happy (it
    reads meta snapshots, never the .sql bytes), and leaves `drizzle-kit generate` with nothing
    to write. Every agreement check passes. Only migration-immutable.mjs fires.

    This is what makes the immutability check non-redundant, and it is also the concrete
    evidence behind split_recommended above.

  drizzle_kit_version: >
    drizzle-kit v0.28.1 / drizzle-orm v0.36.4, confirmed by `./node_modules/.bin/drizzle-kit
    --version`. `generate`, `migrate`, `check`, `push`, `up`, `drop` are all present in --help,
    so `drizzle-kit check` is a real command on this version and not an assumption.
    `generate` and `check` are offline — they diff lib/db/schema.js against the meta snapshots
    and need no database — but drizzle.config.js:14-19 THROWS without a connection string, so
    the job must still set DATABASE_URL_UNPOOLED for steps 6 and 7. It is set to the container.

  pg_dump_version_trap: >
    Do not call pg_dump from the runner's PATH. GitHub's ubuntu-latest image ships the
    PostgreSQL 16 client, and pg_dump 16 REFUSES to dump a server 17 database — it aborts with
    "server version: 17.x; pg_dump version: 16.x". The job would fail for a reason that has
    nothing to do with schema drift, and somebody would eventually "fix" it by adding
    continue-on-error.

    Take the dump through a one-shot container of the same image instead:
      docker run --rm --network host -e PGPASSWORD=postgres postgres:17 \
        pg_dump --schema-only --no-owner --no-privileges -n public \
        -h 127.0.0.1 -p 5432 -U postgres radrvu_ci
    Installing postgresql-client-17 from the PGDG apt repository is an acceptable alternative,
    but only if the job then asserts the major version — which is why migration-replay.mjs
    exits 16 on a non-17 pg_dump rather than trusting the runner image.

  what_this_node_does_not_cover: >
    Rollback of a migration (N02c-rollback-harness), RLS policy presence (N04a), and the
    ephemeral-Neon-branch runner (N03c). This node asserts only that the schema, the migration
    directory, a from-zero replay and the committed baseline dump all describe the same
    database, and that applied migrations are never edited.

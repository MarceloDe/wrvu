id: N00e-mfa-and-password-policy
title: Enable Clerk MFA and remove skipPasswordChecks
goal_refs: [G9, G10]
decisions: [D18]
depends_on: [N00b-rotate-credentials]
phase: A0
estimate_hours: 1
priority: 5
severity: live-exposure

rationale: >
  The application has no second factor of any kind. Both user-creation paths pass
  skipPasswordChecks: true (setup-clerk/route.js:101 and :128, and the surviving
  admin/actions.js path), which disables Clerk's breach-corpus and strength validation,
  leaving only a local 8-character floor. For an application that will hold a vault key
  reference and, shortly, patient data, a single leaked reused password is full account
  compromise. N00b revokes existing sessions; this node ensures what replaces them is
  actually stronger.

context_query: >
  codegraph explore "skipPasswordChecks createUser deleteUser admin actions clerk password"

contracts:
  - TOTP MFA plus backup codes are enabled on the Clerk production instance
  - MFA enrolment is required, not optional, for every user
  - skipPasswordChecks appears nowhere in the codebase
  - The admin user-creation path relies on Clerk's own password validation
  - The local 8-character floor is removed in favour of Clerk's policy, not layered under it

invariants: [INV-CLERK-PHI-FREE]

verify:
  runtime:
    - "node scripts/ops/clerk-admin.mjs --show-instance-settings   # asserts TOTP and backup codes enabled, MFA required"
    - "node scripts/verify/mfa-required.mjs
       # signs in a seeded test user with a correct password and asserts the session is
       # not fully established until the second factor is supplied"
    - "node scripts/verify/weak-password-rejected.mjs
       # asserts admin user creation with a known-breached password is rejected by Clerk"
  static:
    - "! grep -rn 'skipPasswordChecks\\|skip_password_checks' ."
  evidence: [instance-settings.json, mfa-required.txt, weak-password-rejected.txt]

done_when:
  - A correct password alone does not produce an authenticated session
  - A known-breached password is rejected at user creation by Clerk, not by a local length check
  - skipPasswordChecks exists nowhere in the repository
  - Every existing user has enrolled a second factor, or is blocked until they do

rollback: >
  MFA enforcement can be relaxed in the Clerk dashboard without a deploy. Do not — a
  relaxation here is a silent regression with no code diff to review, which is exactly
  the failure mode this node exists to prevent.

notes: >
  Requiring MFA will lock out any colleague mid-onboarding. Coordinate the enforcement
  flip with the roster review from N00b so nobody is surprised, and keep the operator CLI
  available to clear a genuinely stuck account — locally, with an audit entry.

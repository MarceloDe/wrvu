# N03 — the checks every PR must pass.
#
# ONE job, key `checks`, with NO job-level `name:` and NO `strategy.matrix`.
# Both would rename the required status-check context (which is the job's DISPLAY
# name), leaving branch protection requiring a context that never reports and main
# permanently unmergeable.
#
# iOS is deliberately absent. N20y established that rotatedFixtureStillParses fails
# on the iOS 27 runtime and passes 52/52 on 26.5 — a Vision regression, not a code
# defect. A macOS runner is a follow-up and MUST invoke neurorvu-ios/scripts/test-ios.sh
# rather than spelling out its own destination, or the pin stops being a pin.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: ensure chromium
        # NOT `npx playwright install`: this project depends on playwright-core, so npx
        # cannot resolve a local binary and prompts "Ok to proceed?" on a runner with no
        # stdin — an infinite hang. See the script for the full story.
        run: node scripts/verify/harness/ensure-chromium.mjs
      - name: npm run lint
        run: npm run lint
      - name: npx tsc --noEmit
        run: npx tsc --noEmit
      - name: npm run test:redaction
        run: npm run test:redaction
      - name: npm run test:forged-attachment
        run: npm run test:forged-attachment
      - name: npm run test:error-envelope
        run: npm run test:error-envelope
      - name: npm run test:route-contracts
        run: npm run test:route-contracts
      - name: npm run test:llm-proxy-contract
        run: npm run test:llm-proxy-contract
      - name: next build
        # A syntactically valid but unreachable URL. The build only needs the driver to
        # construct without throwing at import; it never opens a connection. Using a real
        # database here would put production credentials in CI for no benefit.
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          DATABASE_URL_UNPOOLED: postgres://ci:ci@127.0.0.1:5432/ci
        run: npx next build
      - name: generated clients match the contract
        run: node scripts/verify/contracts-fresh.mjs
      - name: contract change is additive
        run: node scripts/verify/contracts-additive.mjs
      - name: specialty tags rank but never restrict
        # 78 is PENDING: the completeness half needs a reachable reference database.
        run: node scripts/verify/taxonomy-never-restricts.mjs || [ $? -eq 78 ]
      - name: no modality is guessed into a paid bucket
        run: node scripts/verify/no-guessed-modality.mjs
      - name: one price table only
        run: node scripts/verify/no-second-price-table.mjs
      - name: OCR prompt prices match the reference
        run: node scripts/verify/prompt-prices-fresh.mjs
      - name: no table in public is exposed by default
        # 78 is PENDING: CI has no reachable database to inspect grants on.
        run: node scripts/verify/table-exposure.mjs || [ $? -eq 78 ]
      - name: money has one path
        # 78 is PENDING: the static half always runs; the runtime half needs a reachable
        # reference database, which CI does not have.
        run: node scripts/verify/money-one-path.mjs || [ $? -eq 78 ]
      - name: pricing matches the CMS source
        # 78 is PENDING: CI has no reachable reference database. Reported, never
        # swallowed — a real disagreement still exits 1 and fails the build.
        run: node scripts/verify/pricing-parity.mjs || [ $? -eq 78 ]
      - name: native contract (iOS) is intact
        # 78 is PENDING: the runner has no neurorvu-ios checkout (D43 federates the
        # repos), so the comparison cannot run. Reported, never swallowed — 1 still fails.
        run: node scripts/verify/native-contract.mjs || [ $? -eq 78 ]
      - name: migration journal is complete
        run: node scripts/verify/journal-complete.mjs
      - name: shippability parity
        # The steps above ARE the INV-ALWAYS-SHIPPABLE gate. shippable.mjs is the same
        # list as one harness, which is what a Validator runs on a node branch. This
        # asserts the two have not drifted; re-running the harness here would only
        # double CI time and would lose per-step attribution in the UI.
        run: node scripts/verify/shippable-parity.mjs
      - name: invariant checks are executable
        run: node scripts/verify/checks-are-executable.mjs
